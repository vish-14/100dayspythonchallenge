<template>
  <style>
    {{BASE_CSS}}
    #hook-title { position: absolute; left: 0; top: 0; width: 1080px; height: 1010px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--paper); padding-top: 30px; }
    #hook-l1 { font-size: 128px; }
    #hook-l2 { font-size: 196px; margin-top: 10px; }
    #hook-rule { width: 760px; height: 3px; background: var(--gray-dark); margin: 40px 0 34px; transform-origin: 50% 50%; }
    #hook-row3 { display: flex; align-items: center; gap: 26px; font-size: 112px; color: #7EA2FF; }
    #hook-one { width: 132px; height: 132px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 92px; flex: none; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-bg" class="full bg-dark"></div>
    <div id="hook-title">
      <div id="hook-l1" class="disp">{{c.l1}}</div>
      <div id="hook-l2" class="disp">{{c.l2}}</div>
      <div id="hook-rule"></div>
      <div class="mask" style="padding:6px 0 10px"><div id="hook-row3" class="disp"><div id="hook-one">1</div><span>{{c.l3}}</span></div></div>
    </div>
    {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      // frame 0: "4 EVERYDAY TASKS." already on screen (the cover frame)
      tl.fromTo("#hook-l1", { scale: 1 }, { scale: 1.05, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, W.four);
      tl.fromTo("#hook-l2", { scale: 1 }, { scale: 1.05, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, W.tasks);
      tl.fromTo("#hook-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, W.tasks + 0.15);
      // "One AI agent": the answer rises in blue as the presenter enters
      tl.fromTo("#hook-row3", { yPercent: 110 }, { yPercent: 0, duration: 0.42, ease: "power4.out" }, W.one - 0.06);
      tl.fromTo("#hook-one", { scale: 0.4 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)" }, W.one);
      tl.fromTo(["#hook-chrome-top", "#hook-chrome-bot"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, W.one + 0.1);
      tl.fromTo("#hook-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
