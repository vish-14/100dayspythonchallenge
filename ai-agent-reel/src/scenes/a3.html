<template>
  <style>
    {{BASE_CSS}}
    #a3-doc { left: 56px; top: 466px; width: 390px; height: 424px; }
    #a3-doc .pad { padding: 18px 24px; }
    .a3-row { display: flex; gap: 12px; margin-top: 12px; } .a3-row .ln { flex: 1; }
    #a3-scan { position: absolute; left: 56px; top: 524px; width: 390px; height: 6px; background: var(--blue); box-shadow: 0 0 24px 6px rgba(34,87,239,.55); opacity: 0; }
    .a3-f { position: absolute; left: 488px; width: 536px; height: 86px; border-radius: 16px; background: var(--ink-2); border: 2px solid var(--gray-line);
      display: flex; align-items: center; justify-content: space-between; padding: 0 22px; }
    .a3-f .k { font-family: 'JetBrains Mono', monospace; font-size: 19px; letter-spacing: .16em; color: var(--gray); }
    .a3-f .v { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 30px; color: var(--paper); }
    .a3-f .hl { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 16px 0 0 16px; background: var(--blue); }
    #a3-sum { left: 56px; top: 466px; width: 968px; height: 410px; padding: 0; }
    .a3-b { display: flex; align-items: center; gap: 16px; margin: 20px 30px 0; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 34px; color: var(--ink); }
    .a3-b i { width: 14px; height: 14px; border-radius: 50%; background: var(--blue); flex: none; }
    #a3-check { position: absolute; left: 30px; bottom: 26px; display: flex; align-items: center; gap: 16px; font-size: 27px; font-weight: 700; color: #2A3242; }
    #a3-box { width: 44px; height: 44px; border-radius: 10px; border: 4px solid var(--blue); position: relative; }
    #a3-tick { position: absolute; inset: 0; background: var(--blue); border-radius: 4px; color: #fff; font-weight: 900; font-size: 30px; display: flex; align-items: center; justify-content: center; }
  </style>
  <div id="root" data-composition-id="a3" data-width="1080" data-height="1920">
    <div id="a3-bg" class="panel bg-dark"></div>
    <div class="head" style="color:var(--paper)">
      {{MINIHUB:2}}
      <div class="ttl disp"><div class="mask"><div id="a3-t1">{{c.title.0}}</div></div><div class="mask"><div id="a3-t2">{{c.title.1}}</div></div><div id="a3-via" class="via">{{c.via}}</div></div>
    </div>
    <div id="a3-doc" class="card">
      <div class="bar"><span class="dot b"></span>&nbsp;{{c.doc}}</div>
      <div class="pad">
        <div class="disp" style="font-size:34px;color:var(--ink)">INVOICE</div>
        <div class="a3-row"><div class="ln" style="background:#CBD6F7"></div><div class="ln"></div></div>
        <div class="a3-row"><div class="ln"></div><div class="ln" style="background:#CBD6F7"></div></div>
        <div class="a3-row" style="margin-top:22px"><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>
        <div class="a3-row"><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>
        <div class="a3-row"><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>
        <div class="a3-row" style="margin-top:22px"><div class="ln" style="flex:2"></div><div class="ln" style="background:#CBD6F7"></div></div>
      </div>
    </div>
    <div id="a3-scan"></div>
    <div id="a3-f1" class="a3-f" style="top:470px"><span class="hl"></span><span class="k">{{c.fields.0.0}}</span><span class="v">{{c.fields.0.1}}</span></div>
    <div id="a3-f2" class="a3-f" style="top:574px"><span class="hl"></span><span class="k">{{c.fields.1.0}}</span><span class="v">{{c.fields.1.1}}</span></div>
    <div id="a3-f3" class="a3-f" style="top:678px"><span class="hl"></span><span class="k">{{c.fields.2.0}}</span><span class="v">{{c.fields.2.1}}</span></div>
    <div id="a3-f4" class="a3-f" style="top:782px"><span class="hl"></span><span class="k">{{c.fields.3.0}}</span><span class="v">{{c.fields.3.1}}</span></div>
    <div id="a3-sum" class="card">
      <div class="bar"><span class="tag blue" style="padding:4px 10px">AI summary</span>&nbsp;Draft · for review</div>
      <div id="a3-s1" class="a3-b"><i></i>{{c.summary.0}}</div>
      <div id="a3-s2" class="a3-b"><i></i>{{c.summary.1}}</div>
      <div id="a3-s3" class="a3-b"><i></i>{{c.summary.2}}</div>
      <div id="a3-check"><div id="a3-box"><div id="a3-tick">✓</div></div>{{c.check}}</div>
    </div>
    {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a3-mh", { scale: 0.5, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, W.third - 0.04);
      tl.fromTo(["#a3-mhn2"], { scale: 0.2, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, stagger: 0.08, ease: "back.out(3)" }, W.third + 0.3);
      tl.fromTo(["#a3-mhl2"], { opacity: 0 }, { opacity: 1, duration: 0.25 }, W.third + 0.3);
      tl.fromTo("#a3-via", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3 }, W.third + 0.45);
      tl.fromTo("#a3-t1", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.third + 0.12);
      tl.fromTo("#a3-t2", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.it + 0.05);
      // a document arrives
      tl.fromTo("#a3-doc", { y: 80, opacity: 0, rotation: -3 }, { y: 0, opacity: 1, rotation: 0, duration: 0.5, ease: "expo.out" }, W.pulls - 0.1);
      // "pulls key details": a scan passes over it
      tl.fromTo("#a3-scan", { y: 0, opacity: 0 }, { y: 330, opacity: 1, duration: 0.6, ease: "power1.inOut" }, W.key);
      tl.to("#a3-scan", { opacity: 0, duration: 0.12 }, W.key + 0.6);
      // labelled fields separate out of the page, one by one
      ["#a3-f1", "#a3-f2", "#a3-f3", "#a3-f4"].forEach((f, i) => {
        tl.fromTo(f, { x: -300, opacity: 0, scale: 0.7 }, { x: 0, opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, W.details + i * 0.14);
      });
      // "prepares summaries": page and fields collapse into one summary card
      tl.to("#a3-doc", { scale: 0.5, x: -60, y: -60, opacity: 0, duration: 0.4, ease: "power3.in" }, W.prepares);
      tl.to(["#a3-f1", "#a3-f2", "#a3-f3", "#a3-f4"], { x: -420, scale: 0.6, opacity: 0, duration: 0.36, ease: "power3.in", stagger: 0.03 }, W.prepares + 0.05);
      tl.fromTo("#a3-sum", { opacity: 0, scale: 0.9, transformOrigin: "0% 0%" }, { opacity: 1, scale: 1, duration: 0.42, ease: "expo.out" }, W.summaries - 0.05);
      tl.fromTo(["#a3-s1", "#a3-s2", "#a3-s3"], { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.26, stagger: 0.12, ease: "power2.out" }, W.summaries + 0.12);
      // "for someone to check"
      tl.fromTo("#a3-check", { opacity: 0 }, { opacity: 1, duration: 0.25 }, W.someone);
      tl.fromTo("#a3-tick", { scale: 0 }, { scale: 1, duration: 0.2, ease: "back.out(3)" }, W.check + 0.05);
      tl.fromTo("#a3-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["a3"] = tl;
    })();
  </script>
</template>
