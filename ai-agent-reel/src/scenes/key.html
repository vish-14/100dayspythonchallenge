  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      // "It works through …": the same agent, now with its four tools in full view
      tl.fromTo("#key-agent", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, W.it - 0.12);
      tl.fromTo(["#key-n1", "#key-n2", "#key-n3", "#key-n4"], { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.06, ease: "power3.out" }, W.it);
      tl.fromTo("#key-spokes", { opacity: 0 }, { opacity: 1, duration: 0.3 }, W.it);
      // "your connected tools": every connection goes live, every tool ticks
      tl.set(["#key-f1", "#key-f2", "#key-f3", "#key-f4"], { opacity: 0 }, 0);
      [1, 2, 3, 4].forEach((i, k) => {
        const t = W.connected + k * 0.12;
        tl.to(`#key-f${i}`, { opacity: 1, duration: 0.15 }, t);
        tl.to(`#key-n${i}`, { borderColor: "#2257EF", duration: 0.15 }, t);
        tl.to(`#key-i${i}`, { backgroundColor: "#2257EF", duration: 0.15 }, t);
        tl.fromTo(`#key-c${i}`, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(3)" }, t + 0.1);
      });
      // "and clear rules": each connection gets the rule that starts it
      tl.fromTo(["#key-r1", "#key-r2", "#key-r3", "#key-r4"], { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.09, ease: "back.out(2)" }, W.clear - 0.05);

      tl.fromTo("#key-hl", { opacity: 0 }, { opacity: 1, duration: 0.25 }, W.and_2);
      tl.fromTo("#key-human", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, W.people - 0.05);
      tl.fromTo("#key-ok", { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(3)" }, W.approve + 0.1);
      tl.to("#key-human", { boxShadow: "0 0 0 6px #2257EF, 0 28px 60px rgba(4,8,20,.38)", duration: 0.25 }, W.matters);
      // emphasis words below the caption band, one per idea
      tl.fromTo("#key-emph", { opacity: 0 }, { opacity: 1, duration: 0.01 }, W.connected - 0.05);
      tl.fromTo("#key-e1", { yPercent: 110 }, { yPercent: 0, duration: 0.34, ease: "power4.out" }, W.connected - 0.05);
      tl.to("#key-e1", { yPercent: -110, opacity: 0, duration: 0.26, ease: "power3.in" }, W.clear - 0.22);
      tl.fromTo("#key-e2", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.34, ease: "power4.out" }, W.clear - 0.04);
      tl.set("#key-ec1", { opacity: 0 }, W.clear); tl.set("#key-ec2", { opacity: 1 }, W.clear);
      tl.to("#key-e2", { yPercent: -110, opacity: 0, duration: 0.26, ease: "power3.in" }, W.people - 0.22);
      tl.fromTo("#key-e3", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.34, ease: "power4.out" }, W.people - 0.04);
      tl.set("#key-ec2", { opacity: 0 }, W.people); tl.set("#key-ec3", { opacity: 1 }, W.people);
      window.__timelines["key"] = tl;
    })();
