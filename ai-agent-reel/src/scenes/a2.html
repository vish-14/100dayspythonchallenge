<template>
  <style>
    {{BASE_CSS}}
    #a2-track { position: absolute; left: 110px; top: 712px; width: 860px; height: 4px; background: rgba(245,245,247,.35); }
    #a2-trackfill { position: absolute; left: 110px; top: 712px; width: 860px; height: 4px; background: var(--paper); transform-origin: 0 50%; }
    .a2-mk { position: absolute; top: 698px; width: 32px; height: 32px; border-radius: 50%; background: var(--blue); border: 4px solid var(--paper); }
    .a2-day { position: absolute; top: 744px; width: 200px; text-align: center; font-size: 22px; color: var(--paper); }
    #a2-ring { position: absolute; left: 504px; top: 674px; width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--paper); opacity: 0; }
    #a2-lead { left: 30px; top: 548px; width: 300px; height: 120px; padding: 16px 22px; }
    .a2-k { font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: .16em; color: #5B6372; text-transform: uppercase; }
    .a2-v { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 30px; color: var(--ink); margin-top: 4px; }
    #a2-sent { position: absolute; right: 14px; top: -24px; background: var(--paper); }
    #a2-attn { position: absolute; left: 22px; bottom: -22px; }
    #a2-rem { left: 486px; top: 444px; width: 520px; height: 88px; display: flex; align-items: center; gap: 18px; padding: 0 22px; }
    #a2-bell { width: 60px; height: 60px; border-radius: 16px; background: var(--blue); flex: none; position: relative; }
    #a2-bell::before { content: ""; position: absolute; left: 17px; top: 13px; width: 26px; height: 26px; border-radius: 13px 13px 4px 4px; background: #fff; }
    #a2-bell::after { content: ""; position: absolute; left: 25px; top: 41px; width: 10px; height: 7px; border-radius: 0 0 6px 6px; background: #fff; }
    #a2-msg { left: 110px; top: 800px; width: 860px; height: 92px; display: flex; align-items: center; gap: 18px; padding: 0 24px; }
  </style>
  <div id="root" data-composition-id="a2" data-width="1080" data-height="1920">
    <div id="a2-bg" class="panel bg-blue"></div>
    <div class="head on-blue" style="color:var(--paper)">
      {{MINIHUB:1}}
      <div class="ttl disp"><div class="mask"><div id="a2-t1">{{c.title.0}}</div></div><div class="mask"><div id="a2-t2">{{c.title.1}}</div></div><div id="a2-via" class="via">{{c.via}}</div></div>
    </div>
    <div id="a2-track"></div><div id="a2-trackfill"></div>
    <div id="a2-m1" class="a2-mk" style="left:164px"></div><div id="a2-m2" class="a2-mk" style="left:528px"></div><div id="a2-m3" class="a2-mk" style="left:892px"></div>
    <div id="a2-ring"></div>
    <div id="a2-d1" class="a2-day mono" style="left:80px">{{c.days.0}}</div><div id="a2-d2" class="a2-day mono" style="left:444px">{{c.days.1}}</div><div id="a2-d3" class="a2-day mono" style="left:808px">{{c.days.2}}</div>
    <div id="a2-rem" class="card"><div id="a2-bell"></div><div><div class="a2-k">Reminder · Day 3</div><div class="a2-v" style="font-size:27px">{{c.reminder}}</div></div></div>
    <div id="a2-msg" class="card"><span class="tag blue">✓ Approved</span><span class="a2-v" style="font-size:26px;font-weight:700;font-family:Inter,sans-serif">{{c.message}}</span></div>
    <div id="a2-lead" class="card" style="overflow:visible">
      <div class="a2-k">Lead</div><div class="a2-v">{{c.lead}}</div><div class="a2-k" style="margin-top:2px">{{c.lead_sub}}</div>
      <span id="a2-sent" class="tag ghost" style="color:var(--blue)">Sent ✓</span>
    </div>
    {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a2-mh", { scale: 0.5, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, W.second - 0.04);
      tl.fromTo(["#a2-mhn1"], { scale: 0.2, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, stagger: 0.08, ease: "back.out(3)" }, W.second + 0.3);
      tl.fromTo(["#a2-mhl1"], { opacity: 0 }, { opacity: 1, duration: 0.25 }, W.second + 0.3);
      tl.fromTo("#a2-via", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3 }, W.second + 0.45);
      tl.fromTo("#a2-t1", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.timely - 0.04);
      tl.fromTo("#a2-t2", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.followups - 0.06);
      // the follow-up timeline draws; the lead moves along it on "timely follow-ups"
      tl.fromTo("#a2-track", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, W.second);
      tl.fromTo(["#a2-m1", "#a2-m2", "#a2-m3"], { scale: 0 }, { scale: 1, duration: 0.25, stagger: 0.1, ease: "back.out(2.5)" }, W.second + 0.2);
      tl.fromTo(["#a2-d1", "#a2-d2", "#a2-d3"], { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.1 }, W.second + 0.3);
      tl.fromTo("#a2-lead", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, W.sends);
      tl.fromTo("#a2-trackfill", { scaleX: 0 }, { scaleX: 0.42, duration: 0.7, ease: "power2.inOut" }, W.timely);
      tl.to("#a2-lead", { x: 364, duration: 0.7, ease: "power2.inOut" }, W.timely);
      // Day 3 arrives: the reminder fires
      tl.fromTo("#a2-ring", { scale: 0.5, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.6, ease: "power2.out" }, W.followups + 0.1);
      tl.fromTo("#a2-rem", { opacity: 0, y: -24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(2)" }, W.followups + 0.2);
      // "using messages you've approved in advance": a pre-approved message is sent to the lead
      tl.fromTo("#a2-msg", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, W.using - 0.05);
      tl.to("#a2-msg", { x: 220, y: -210, scale: 0.3, opacity: 0, duration: 0.45, ease: "power3.in" }, W.advance + 0.15);
      tl.fromTo("#a2-sent", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, W.advance + 0.52);
      tl.to("#a2-rem", { opacity: 0.35, duration: 0.3 }, W.advance + 0.52);

      tl.fromTo("#a2-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["a2"] = tl;
    })();
  </script>
</template>
