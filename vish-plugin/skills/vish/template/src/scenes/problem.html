  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      const IN = [
        ["#pb-c1", W.enquiries, { x: -260, y: 30, rotation: -12 }, -4],
        ["#pb-c2", W.followups, { x: 260, y: -20, rotation: 10 }, 3],
        ["#pb-c3", W.updates, { x: -40, y: 300, rotation: 6 }, 2.5],
        ["#pb-c4", W.reports, { x: 200, y: 260, rotation: -9 }, -3],
      ];
      // each card lands on its word, from a different direction, and settles at a slight angle
      IN.forEach(([id, t, from, rot]) => {
        tl.fromTo(id, { ...from, opacity: 0, scale: 0.9 }, { x: 0, y: 0, rotation: rot, opacity: 1, scale: 1, duration: 0.42, ease: "expo.out" }, t - 0.06);
      });
      // small jobs keep interrupting: badges pop one by one, the pile tilts further
      ["#pb-b1", "#pb-b2", "#pb-b3", "#pb-b4"].forEach((b, i) => {
        tl.fromTo(b, { scale: 0 }, { scale: 1, duration: 0.24, ease: "back.out(3)" }, W.small + i * 0.14);
      });
            // "interrupting your day": the clutter compresses into one organised queue
      ["#pb-c1", "#pb-c2", "#pb-c3", "#pb-c4"].forEach((c, i) => {
        tl.to(c, { x: [180, -150, 160, -170][i], y: [120, 150, -60, -40][i], rotation: 0, scale: 0.35, opacity: 0, duration: 0.36, ease: "power3.in" }, W.interrupting - 0.05 + i * 0.03);
      });
      tl.fromTo("#pb-queue", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, W.interrupting + 0.22);
      tl.fromTo(["#pb-q1", "#pb-q2", "#pb-q3", "#pb-q4"], { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.26, stagger: 0.06, ease: "power2.out" }, W.interrupting + 0.3);
      tl.fromTo("#problem-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["problem"] = tl;
    })();
  </script>
