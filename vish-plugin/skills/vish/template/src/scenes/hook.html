<template>
  <style>
    {{BASE_CSS}}
    #hook-title { position: absolute; left: 0; top: 0; width: 1080px; height: 1010px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--paper); }
    #hook-four { font-size: 200px; }
    #hook-row { display: flex; align-items: center; font-size: 190px; margin-top: 6px; }
    #hook-o { width: 136px; height: 136px; border-radius: 50%; background: var(--blue); margin: 0 8px 0 6px; }
    #hook-tasks { font-size: 190px; }
    #hook-rule { width: 760px; height: 3px; background: var(--gray-dark); margin-top: 34px; transform-origin: 50% 50%; }
    #hook-sub { font-size: 40px; margin-top: 30px; color: var(--paper); letter-spacing: .34em; }
    #hook-cover { position: absolute; left: 370px; top: 443px; width: 100px; height: 100px; border-radius: 50%; background: var(--blue); opacity: 0; }
    #hook-flow { position: absolute; left: 0; top: 0; width: 1080px; height: 1010px; }
    #hook-typed { position: absolute; left: 0; width: 1080px; top: 400px; text-align: center; font-size: 46px; color: var(--paper); font-weight: 700; letter-spacing: .26em; }
    #hook-caret { display: inline-block; width: 16px; height: 44px; background: var(--blue); vertical-align: -6px; margin-left: 6px; }
    .hk-line { position: absolute; top: 588px; height: 4px; background: var(--gray-dark); transform-origin: 0 50%; }
    .hk-fill { position: absolute; top: 588px; height: 4px; background: var(--blue); transform-origin: 0 50%; }
    .hk-node { position: absolute; top: 545px; width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--gray-dark); background: var(--ink); }
    .hk-node i { position: absolute; inset: 8px; border-radius: 50%; background: var(--blue); }
    .hk-lab { position: absolute; top: 668px; width: 220px; text-align: center; font-size: 21px; color: var(--paper); letter-spacing: .14em; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-bg" class="full bg-dark"></div>
    <div id="hook-flow">
      <div id="hook-typed" class="mono"><span id="hook-typed-text">{{c.typed}}</span><span id="hook-caret"></span></div>
      <div id="hook-l1" class="hk-line" style="left:195px;width:153px"></div><div id="hook-f1" class="hk-fill" style="left:195px;width:153px"></div>
      <div id="hook-l2" class="hk-line" style="left:438px;width:154px"></div><div id="hook-f2" class="hk-fill" style="left:438px;width:154px"></div>
      <div id="hook-l3" class="hk-line" style="left:682px;width:153px"></div><div id="hook-f3" class="hk-fill" style="left:682px;width:153px"></div>
      <div id="hook-n2" class="hk-node" style="left:348px"><i id="hook-n2i"></i></div>
      <div id="hook-n3" class="hk-node" style="left:592px"><i id="hook-n3i"></i></div>
      <div id="hook-n4" class="hk-node" style="left:835px"><i id="hook-n4i"></i></div>
      <div id="hook-lab1" class="hk-lab mono" style="left:40px">{{c.nodes.0}}</div>
      <div id="hook-lab2" class="hk-lab mono" style="left:283px">{{c.nodes.1}}</div>
      <div id="hook-lab3" class="hk-lab mono" style="left:527px">{{c.nodes.2}}</div>
      <div id="hook-lab4" class="hk-lab mono" style="left:770px">{{c.nodes.3}}</div>
    </div>
    <div id="hook-title">
      <div id="hook-four" class="disp">{{c.num}}</div>
      <div id="hook-row" class="disp"><span id="hook-b">{{c.word_a}}</span><span id="hook-o"></span><span id="hook-ring">{{c.word_b}}</span></div>
      <div class="mask"><div id="hook-tasks" class="disp">{{c.word2}}</div></div>
      <div id="hook-rule"></div>
      <div id="hook-sub" class="mono">{{c.sub}}</div>
    </div>
    <div id="hook-cover"></div>
    {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      // frame 0: "4 B●RING" already on screen (the thumbnail), TASKS lands on its word
      tl.fromTo("#hook-four", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, W.four);
      tl.fromTo("#hook-tasks", { yPercent: 105 }, { yPercent: 0, duration: 0.32, ease: "power4.out" }, W.tasks - 0.08);
      tl.fromTo("#hook-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, W.tasks + 0.2);
      // "One smarter workflow": the title settles into the top panel as the presenter rises
      tl.fromTo("#hook-title", { y: 0, scale: 1 }, { y: 20, scale: 0.66, duration: 0.55, ease: "power3.inOut" }, W.one - 0.05);
      tl.fromTo("#hook-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, W.one + 0.22);
      tl.fromTo(["#hook-chrome-top", "#hook-chrome-bot"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, W.one + 0.2);
      // the O becomes the blue field, then contracts into the first workflow node
      const CV = W.workflow + 0.32;
      tl.set("#hook-cover", { opacity: 1 }, CV);
      tl.set("#hook-chrome-top", { color: "#F5F5F7" }, CV);
      tl.set("#hook-chrome-top", { color: "#8A93A3" }, CV + 0.9);
      tl.set("#hook-o", { opacity: 0 }, CV);
      tl.fromTo("#hook-cover", { scale: 0.93 }, { scale: 26, duration: 0.4, ease: "power3.in" }, CV);
      tl.set("#hook-title", { opacity: 0 }, CV + 0.4);
      tl.to("#hook-cover", { x: 150 - 420, y: 590 - 493, scale: 0.9, duration: 0.5, ease: "expo.out" }, CV + 0.4);
      tl.fromTo("#hook-flow", { opacity: 0 }, { opacity: 1, duration: 0.2 }, CV + 0.5);
      // the workflow grows one node per beat
      [["#hook-l1", "#hook-n2"], ["#hook-l2", "#hook-n3"], ["#hook-l3", "#hook-n4"]].forEach(([l, n], i) => {
        tl.fromTo(l, { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out" }, CV + 0.62 + i * 0.13);
        tl.fromTo(n, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(2)" }, CV + 0.72 + i * 0.13);
      });
      tl.fromTo(["#hook-lab1", "#hook-lab2", "#hook-lab3", "#hook-lab4"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08, ease: "power2.out" }, CV + 0.8);
      tl.fromTo("#hook-typed-text", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "steps(13)" }, W.ai - 0.05);
      tl.fromTo("#hook-caret", { opacity: 0 }, { opacity: 1, duration: 0.01 }, W.ai + 0.45);
      [W.ai + 0.6, W.automation + 0.45, W.helps + 0.1].forEach((t, i) => {
        tl.fromTo(`#hook-f${i + 1}`, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, t - 0.3);
        tl.fromTo(`#hook-n${i + 2}i`, { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2.5)" }, t);
      });
      tl.fromTo("#hook-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
