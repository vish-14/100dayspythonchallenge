<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000000;
        --white: #ffffff;
        --grey: #9a9a9a;
        --gold: #f5b700;
        --font-display: "Anton", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root {
        position: relative; width: 100%; height: 100%; background: var(--ground);
        font-family: var(--font-display); color: var(--white);
      }
      /* Every scene lives inside the safe area: 250px from the top, 400px from the bottom. */
      .clip {
        position: absolute; left: 70px; right: 70px; top: 250px; bottom: 400px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }
      .t { line-height: 1.08; letter-spacing: 0.005em; }

      #s1 .t { font-size: 160px; }
      #s1 .w2, #s1 .w3 { display: none; }
      .no { font-size: 120px; }
      #s3 .t { font-size: 100px; color: var(--grey); }
      #s4 .t { font-size: 100px; color: var(--grey); }
      #s5 .line { overflow: hidden; padding: 0.06em 0.1em; }
      #s5 .line span { display: inline-block; font-size: 110px; line-height: 1.08; }
      #s5 .l3 span { color: var(--white); }
      #s6 .start { font-size: 180px; color: var(--gold); line-height: 1.05; }
      #s6 .today { font-size: 180px; color: var(--white); line-height: 1.05; }
      #flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">
      <audio id="sound" src="assets/nobody-sound.mp3" data-start="0" data-duration="18" data-volume="1"></audio>

      <!-- 0–3s · Nobody is coming to save you. -->
      <section id="s1" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="t" id="s1t"><span class="w1">Nobody</span><span class="w2"> is coming</span><span class="w3"> to save you.</span></div>
      </section>

      <!-- 3–6.2s · the list -->
      <section id="s2a" class="clip" data-start="3" data-duration="1" data-track-index="0"><div class="t no" id="n1">No investor.</div></section>
      <section id="s2b" class="clip" data-start="4" data-duration="1" data-track-index="0"><div class="t no" id="n2">No mentor.</div></section>
      <section id="s2c" class="clip" data-start="5" data-duration="1.25" data-track-index="0"><div class="t no" id="n3">No perfect timing.</div></section>
      <!-- 6.25–7s · pure black -->

      <!-- 7–9s · Just you. -->
      <section id="s3" class="clip" data-start="7" data-duration="2" data-track-index="0">
        <div class="t" id="just">Just you.</div>
      </section>

      <!-- 9–11.4s · And that's the good news. -->
      <section id="s4" class="clip" data-start="9" data-duration="2.4" data-track-index="0">
        <div class="t" id="good" data-layout-allow-overlap>And that's the good news.</div>
      </section>

      <!-- 11–15s · Because it means you don't need permission. -->
      <section id="s5" class="clip" data-start="11" data-duration="4" data-track-index="1">
        <div data-layout-allow-overflow class="line l1"><span id="b1">Because it means</span></div>
        <div data-layout-allow-overflow class="line l2"><span id="b2">you don't need</span></div>
        <div data-layout-allow-overflow class="line l3" id="l3"><span id="b3">permission.</span></div>
      </section>

      <!-- 15–17.5s · Start today. then hard cut to black until the loop point -->
      <section id="s6" class="clip" data-start="15" data-duration="2.5" data-track-index="0">
        <div id="startwrap">
          <div class="t start" id="start" data-layout-allow-occlusion>Start</div>
          <div class="t today" id="today">today.</div>
        </div>
      </section>

      <div id="flash" class="clip-overlay"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---- 0–3: hard snaps
      tl.set("#s1 .w2", { display: "inline" }, 1.0);
      tl.set("#s1 .w3", { display: "inline" }, 2.0);
      // slight shake on the full line (deterministic offsets)
      [[-14, 6], [12, -8], [-10, -4], [8, 6], [-5, -3], [0, 0]].forEach(([x, y], i) => {
        tl.set("#s1t", { x, y }, 2.0 + i * 0.045);
      });

      // ---- 3–6: each line flashes in
      ["#n1", "#n2", "#n3"].forEach((id, i) => {
        const t = 3 + i;
        tl.fromTo(id, { scale: 1.14, opacity: 0.35, textShadow: "0 0 40px rgba(255,255,255,0.9)" },
          { scale: 1, opacity: 1, textShadow: "0 0 0px rgba(255,255,255,0)", duration: 0.14, ease: "power2.out" }, t);
      });

      // ---- 7–9: slow fade, then slow zoom
      tl.fromTo("#just", { opacity: 0, scale: 1 }, { opacity: 1, duration: 0.9, ease: "sine.inOut" }, 7.0);
      tl.to("#just", { scale: 1.1, duration: 1.0, ease: "sine.inOut" }, 8.0);

      // ---- 9–11: grey to gold, then glow
      tl.fromTo("#good", { color: "#9a9a9a", textShadow: "0 0 0px rgba(245,183,0,0)" },
        { color: "#f5b700", duration: 1.0, ease: "sine.inOut" }, 9.0);
      tl.to("#good", { textShadow: "0 0 50px rgba(245,183,0,0.55)", duration: 0.8, ease: "sine.out" }, 10.0);
      tl.to("#good", { y: -260, opacity: 0, duration: 0.4, ease: "power3.in" }, 11.0);

      // ---- 11–14: words slide up from below, one line per second
      tl.fromTo("#b1", { yPercent: 115 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, 11.1);
      tl.fromTo("#b2", { yPercent: 115 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, 12.0);
      tl.fromTo("#b3", { yPercent: 115 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, 13.0);
      tl.to("#b3", { color: "#f5b700", duration: 0.35, ease: "sine.out" }, 13.3);
      // ---- 14: only "permission." stays, centres and scales up
      tl.to(["#b1", "#b2"], { opacity: 0, duration: 0.4, ease: "sine.in" }, 14.0);
      // one line box = 110px * 1.08 + padding; moving up one box puts it at the centre
      tl.to("#l3", { y: -132, scale: 1.4, duration: 0.7, ease: "power3.inOut" }, 14.0);

      // ---- 15: flash, Start; 16: today. slams; 17: pulse
      tl.fromTo("#flash", { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, 15.0);
      tl.fromTo("#today", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power4.in" }, 16.0);
      [[0, 14], [0, -10], [0, 6], [0, 0]].forEach(([x, y], i) => {
        tl.set("#startwrap", { x, y }, 16.12 + i * 0.04);
      });
      tl.to("#startwrap", { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 17.0);
      // 17.5: hard cut (scene ends) — black until the loop restarts at 18s.
      tl.set({}, {}, 18);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
