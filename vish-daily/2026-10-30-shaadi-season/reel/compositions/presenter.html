      const VIS = "rrrrrrrrrrrrrrrrrrrrrrrrrrrrreeaaaaaaaaaaaaaeeeeeaaeeaaoooorrrrroooaaaaaammrrrrrrrrrraaaaarrraaaarrrrrrreeeeaaaarrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrraaooaaaaaabbrrrroommmaaaaaaaaammmmmrrrrrrrrrrrrrrrrrrrrrraaaaaaaaammmaaaaoooooaaaaaaaaaaeeaaooooooeeerrrrrrrrrrraaarrreeaaaaaaaaooeeeaaaaarrraaaaaaaarrrrrrrraaaaammrrrrrrrrrrrrrraaaaaaaaaaaaaaaaaaaaaarrrrrrrrrrrrooaaaoooaaarrrrrooaaaaeeerrrraaaaaaaarrrrrrrrrrrrrrrrrrrrrrrraaaaeeeaaaaaaaaaaaoooaaaooooooooooorrrrraaaaaaaaaaaaaaaaaaaaeeeaaoorrraaaaaaaaaaoooooaaaaoobbbmmrrrrrrrrrrrraaammrrrrraaaaaarreeeooaaarrrrooooaaaaammmbboommmmmmrrrrrrrrrrrrrrrrraaaaaaeerrrrrrraaoooaaaaaaaaaaaaaaaarrrrrrrraaaaaaaaaaooommmaaaaaaabbbmmrrrrrrrrrrooooooaaaarrrrrrrrraaooeeaaaaeeerrrrrroooooaaaaaaaaoooooooeemmrrmmmrrrrrrrrrrrrrreeeaaaaaaaoooorrrraaooooeeaaaaaaammmmrrrrrrraaaabbbbrrrrrrrrrrrraaooaaaaaaaaaaaaaooaaarrrrrmmmaaaaaaaaaaeeeaaabbmmrrrrrrrrrrrrrrrrrraaaaaaaaarrrrraaaaaeeaaaooeeerrraaaaaaaaarrrraaaaaaaaaaaoooaaaaooooeeerrrrrrrrrrrrreeaaaaaooooaaaaoooeeaaaeeerreeaaooaaooorraaaooooeeaabbeeerrrrrrrrrrrrrrrrrraaaaaaaaarrrrrrrrrrrraaaaeeerrrraaaaaaaaoooaaaoooaaaammaaarrrraaaammmeeerrrrrrrrrrrrraaooooeeaaaaaaaaaaaaaaarrrrrrroooaaammmaaaaaaammeeeerrrrrrrrrrrrrrrrrrraaaarrraaeeeeooaaaarrrrraaaooooaaooorrraaaaaaoooaaeeeeeemmmmrrrrrrrrrrrrrraaaaaaaaooaaaaarrraaoooooaaooooooorrrrrrrrrooaaaarrmmmmmbboorrrrrrrrrraaaaaaaaeeeeaaoooaaaaaaaaaaaaammaaaaaooommmmmooaaaaammmaaaaaabbbmmrrrrrrr", FPS = 30, BLINKS = [1.1, 4.7, 7.8, 11.8, 14.7, 17.4, 21.0, 24.1, 28.1, 31.0, 33.7, 37.3], BROWS = [3.44, 11.44, 14.8, 20.003, 25.474, 29.848, 35.085], MOVES = [[7.0, -10, 0], [14.165, 0, 0], [20.053, 10, 0], [25.524, 0, 0], [29.898, 0, 10], [35.135, -10, 0], [39.22, 0, -10]];
      const tl = gsap.timeline({ paused: true });
      // hook mode: cut-out Vish (no background) with this reel's props (news desk + mic, or a wedding turban),
      // jumping on every hard cut and optionally bouncing to the beat; the normal panel returns at the problem
      const HOOK_END = 6.800, CUTS = [[0.0, 0, 1.0], [2.68, -150, 0.9], [4.16, 170, 0.88], [5.63, 0, 1.06]], PROPS = ["#pp-turban"], DANCE = true;
      const ALL = ["#pp-desk", "#pp-mic", "#pp-plate", "#pp-turban"];
      tl.set(ALL.filter((p) => !(HOOK_END > 0 && PROPS.includes(p))), { opacity: 0 }, 0);
      if (HOOK_END > 0) {
        tl.set("#pp-bg", { opacity: 0 }, 0); tl.set("#pp-edge", { opacity: 0 }, 0);
        CUTS.forEach(([t, x, s]) => {
          tl.set("#pp-sprite", { x, scale: s * 1.06 }, t);
          tl.to("#pp-sprite", { scale: s, duration: 0.16, ease: "power3.out" }, t + 0.01);
        });
        if (PROPS.includes("#pp-plate")) tl.to("#pp-plate-dot", { opacity: 0.2, duration: 0.3, yoyo: true, repeat: Math.max(1, Math.floor(HOOK_END / 0.3) - 1), ease: "steps(1)" }, 0);
        if (DANCE) {   // "balle balle": a bounce and a shoulder tilt on every beat (0.3 s at 100 bpm)
          for (let t = 0, k = 0; t < HOOK_END - 0.3; t += 0.3, k++) {
            tl.to("#pp-head", { y: -16, rotation: k % 2 ? 3 : -3, duration: 0.09, ease: "power2.out" }, t);
            tl.to("#pp-head", { y: 0, rotation: 0, duration: 0.17, ease: "power2.in" }, t + 0.09);
            tl.to("#pp-body", { y: -8, duration: 0.09, ease: "power2.out" }, t + 0.02);
            tl.to("#pp-body", { y: 0, duration: 0.17, ease: "power2.in" }, t + 0.11);
          }
        }
        tl.set("#pp-bg", { opacity: 1 }, HOOK_END); tl.set("#pp-edge", { opacity: 1 }, HOOK_END);
        tl.set("#pp-sprite", { x: 0, scale: 1 }, HOOK_END);
        tl.set(["#pp-head", "#pp-body"], { y: 0, rotation: 0 }, HOOK_END);
        tl.set(PROPS, { opacity: 0 }, HOOK_END);
      }
      const $ = (id) => document.getElementById(id);
      const mouths = { r: $("pp-m-r"), m: $("pp-m-m"), b: $("pp-m-b"), a: $("pp-m-a"), e: $("pp-m-e"), o: $("pp-m-o") };
      const eyes = { open: $("pp-eyes-open"), half: $("pp-eyes-half"), closed: $("pp-eyes-closed") };
      const brows = { n: $("pp-brows-neutral"), u: $("pp-brows-up") };
      const head = $("pp-head");

      if (0.000 < 0.1) tl.set("#pp-panel", { y: 0 }, 0);  // an anchor already on air at frame 0
      else tl.fromTo("#pp-panel", { y: 910 }, { y: 0, duration: 0.55, ease: "power3.out" }, 0.000);
      tl.to("#pp-panel", { y: 910, duration: 0.4, ease: "power3.in" }, 40.176 - 0.4);

      function render() {
        const t = tl.time();
        const f = Math.max(0, Math.min(VIS.length - 1, Math.floor(t * FPS + 1e-6)));
        const v = VIS[f];
        for (const k in mouths) mouths[k].style.opacity = k === v ? 1 : 0;
        let e = "open";
        for (const b of BLINKS) {
          const d = t - b;
          if (d >= 0 && d < 0.034) e = "half"; else if (d >= 0.034 && d < 0.1) e = "closed"; else if (d >= 0.1 && d < 0.134) e = "half";
        }
        for (const k in eyes) eyes[k].style.opacity = k === e ? 1 : 0;
        const up = BROWS.some((b) => t >= b && t < b + 0.75);
        brows.u.style.opacity = up ? 1 : 0; brows.n.style.opacity = up ? 0 : 1;
        let dx = 0, dy = 0;
        for (const [mt, mx, my] of MOVES) if (t >= mt) { dx = mx; dy = my; }
        head.style.translate = `${dx}px ${dy}px`;
      }
      const drive = { p: 0 };
      tl.to(drive, { p: 1, duration: 49.400, ease: "none", onUpdate: render }, 0);
      render();
      window.__timelines["presenter"] = tl;
