      mk($("petals"), "i", 34, (p, i) => { p.style.left = ((i * 211) % 1060) + "px"; p.style.background = i % 3 ? "#FF922B" : "#FFD43B"; });

      const tl = gsap.timeline({ paused: true });
      const F = ["#f0", "#f1", "#f2", "#f3", "#f4", "#f5", "#f6"];
      const flash = (t, o = 0.8, d = 0.14) => tl.fromTo("#fl", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
      const shake = (sel, t, amp = 16, n = 6) => {
        for (let i = 0; i < n; i++) { const a = amp * (1 - i / n); tl.to(sel, { x: (i % 2 ? -1 : 1) * a, y: (i % 3 - 1) * a * 0.6, duration: 0.035, ease: "none" }, t + i * 0.035); }
        tl.to(sel, { x: 0, y: 0, duration: 0.05, ease: "none" }, t + n * 0.035);
      };
      // hard cut with a punch-in (and optional flash/shake); "whip" slides the frame in sideways with speed lines
      const cut = (i, t, { punch = 1.18, fl = 0.7, sh = 14, whip = 0 } = {}) => {
        F.forEach((f, j) => tl.set(f, { visibility: j === i ? "visible" : "hidden" }, t));
        if (whip) {
          tl.fromTo(F[i], { x: whip * 1080, scale: 1.1 }, { x: 0, scale: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, t);
          tl.fromTo("#speed", { opacity: 0.9, x: whip * 200 }, { opacity: 0, x: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, t);
        } else tl.fromTo(F[i], { scale: punch }, { scale: 1, duration: 0.28, ease: "power4.out", immediateRender: false }, t);
        tl.to(F[i], { scale: 1.05, duration: 2.2, ease: "none" }, t + 0.3);
        if (fl) flash(t, fl);
        if (sh) shake(F[i], t + 0.08, sh);
      };
      const punch = (sel, t, s = 1.08, d = 0.07) => tl.fromTo(sel, { scale: 1 }, { scale: s, duration: d, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t);
      const pops = (sel, t) => tl.fromTo(sel, { scale: 0.2, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.22, ease: "back.out(2.6)", immediateRender: false }, t);

      // F0 "Balle balle!": frame 0 is the thumbnail, fully readable; the sunburst spins, confetti bursts on the first hit
      cut(0, 0, { punch: 1, fl: 0, sh: 0 });
      tl.to("#f0-sun", { rotation: 90, duration: W.shaadi + 0.5, ease: "none" }, 0);
      tl.fromTo("#f0-glow", { opacity: 0.6 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0);
      gsap.utils.toArray("#confetti i").forEach((c, i) => {
        const a = (i / 44) * Math.PI * 2 + (i % 3) * 0.2, r = 380 + (i % 5) * 90;
        tl.fromTo(c, { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.9 + 260, rotation: 360 + i * 37, opacity: 0, duration: 1.3, ease: "power3.out", immediateRender: false }, BEAT0 - 0.02);
      });
      tl.set("#confetti i", { opacity: 0 }, 0);
      // "BALLE" / "BALLE!" punch alternately on the dhol's half beats until the first word
      for (let t = BEAT0, k = 0; t < W.shaadi - 0.1; t += BEAT / 2, k++) punch(k % 2 ? "#f0-l2" : "#f0-l1", t, 1.14, 0.08);
      shake("#f0", BEAT0, 18, 6);
      // F1 "Shaadi ka season aa gaya!"
      cut(1, W.shaadi - 0.05, { punch: 1.3, fl: 0.7, sh: 14 });
      gsap.utils.toArray("#garlands .gar").forEach((g, i) => tl.fromTo(g, { rotation: -6 }, { rotation: 6, duration: 0.45, yoyo: true, repeat: 5, ease: "sine.inOut" }, W.shaadi + 0.05 * (i % 3)));
      tl.fromTo("#f1-l2", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.out", immediateRender: false }, W.season - 0.04);
      tl.set("#f1-l2", { opacity: 0 }, 0);
      tl.fromTo("#f1-tag", { scale: 0, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.22, ease: "back.out(2.6)", immediateRender: false }, W.aa - 0.03);
      tl.set("#f1-tag", { opacity: 0 }, 0);
      shake("#f1", W.aa, 14, 5);
      // F2 Mehendi: henna draws itself on the palm
      cut(2, W.mehendi - 0.05, { whip: 1, fl: 0, sh: 0 });
      tl.fromTo("#f2-hand", { rotation: -10, y: 80 }, { rotation: 4, y: 0, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, W.mehendi - 0.05);
      gsap.utils.toArray("#f2-hand .hn").forEach((p, i) => {
        const L = p.getTotalLength ? p.getTotalLength() : 300; p.style.strokeDasharray = L;
        tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, W.mehendi + 0.02 + i * 0.025);
        tl.set(p, { strokeDashoffset: L }, 0);
      });
      // F3 Sangeet: spotlights sweep, the disco ball spins, notes fly, dancers on the beat
      cut(3, W.sangeet - 0.05, { whip: -1, fl: 0, sh: 0 });
      [1, 2, 3].forEach((k) => tl.fromTo("#f3-s" + k, { rotation: k === 2 ? -20 : (k === 1 ? -35 : 35) }, { rotation: k === 2 ? 20 : (k === 1 ? 10 : -10), duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, W.sangeet - 0.05));
      tl.fromTo("#f3-ball", { rotation: 0, scale: 0.6 }, { rotation: 180, scale: 1, duration: 0.8, ease: "power2.out", immediateRender: false }, W.sangeet - 0.05);
      gsap.utils.toArray("#f3-notes b").forEach((n, i) => tl.fromTo(n, { y: 0, opacity: 1, rotation: -10 }, { y: -700 - (i % 3) * 120, opacity: 0, rotation: 20, duration: 1.0, ease: "power1.out", immediateRender: false }, W.sangeet + (i % 5) * 0.06));
      // F4 Baraat: fireworks over the band and the crowd
      cut(4, W.baraat - 0.05, { whip: 1, fl: 0.4, sh: 0 });
      [1, 2, 3].forEach((k) => {
        const t0 = W.baraat - 0.02 + (k - 1) * 0.16;
        tl.fromTo(`#fw${k} i`, { scaleY: 0, opacity: 1, y: 0 }, { scaleY: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, t0);
        tl.to(`#fw${k} i`, { opacity: 0, y: 30, duration: 0.45, ease: "power1.in" }, t0 + 0.3);
        tl.fromTo(`#fw${k}`, { scale: 0.6 }, { scale: 1.6, duration: 0.75, ease: "power2.out", immediateRender: false }, t0);
      });
      pops("#f4-band", W.baraat + 0.1);
      tl.set("#f4-band", { opacity: 0 }, 0);
      shake("#f4", W.baraat + 0.05, 16, 6);
      // dancers on every frame swap poses on the half beat; fairy lights twinkle; petals rain until the question
      const DS = gsap.utils.toArray(".dancer");
      for (let t = BEAT0 % (BEAT / 2), k = 0; t < W.aur; t += BEAT / 2, k++) {
        DS.forEach((d, i) => {
          const a = d.querySelector(".pa"), b = d.querySelector(".pb"), alt = (k + i) % 2;
          tl.set(a, { opacity: alt ? 0 : 1 }, t); tl.set(b, { opacity: alt ? 1 : 0 }, t);
          tl.to(d, { y: -22, duration: 0.09, ease: "power2.out" }, t); tl.to(d, { y: 0, duration: 0.17, ease: "power2.in" }, t + 0.09);
        });
      }
      // gold ring pulses on every dhol beat
      for (let t = BEAT0; t < W.aur - 0.1; t += BEAT) tl.fromTo("#beat", { opacity: 0.85 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      gsap.utils.toArray(".lights i").forEach((b, i) => tl.fromTo(b, { opacity: 1 }, { opacity: 0.25, duration: 0.3, yoyo: true, repeat: 13, ease: "steps(1)" }, (i % 3) * 0.1));
      gsap.utils.toArray("#petals i").forEach((p, i) => {
        const t0 = W.shaadi + (i % 12) * 0.22, dur = 1.8 + (i % 5) * 0.25;
        tl.fromTo(p, { y: -60 - (i % 4) * 120, rotation: 0, x: 0 }, { y: 2000, rotation: 540 + i * 20, x: (i % 2 ? 60 : -60), duration: dur, ease: "none", immediateRender: false }, t0);
      });
      tl.set("#petals", { opacity: 0 }, W.aur - 0.04);
      // F5 "Aur aapke WhatsApp pe?": the party stops
      cut(5, W.aur - 0.04, { punch: 1.3, fl: 0.5, sh: 12 });
      tl.fromTo("#f5-l2", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, W.whatsapp - 0.05);
      tl.set("#f5-l2", { opacity: 0 }, 0);
      shake("#f5", W.whatsapp + 0.1, 14, 5);
      // F6 "200 unread enquiries!": the phone floods, the counter races
      cut(6, W["200"] - 0.12, { punch: 1.25, fl: 0.6, sh: 12 });
      const msgs = gsap.utils.toArray("#f6-feed .msg");
      msgs.forEach((m, i) => tl.fromTo(m, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, W["200"] - 0.05 + i * 0.09));
      tl.fromTo("#f6-feed", { y: 0 }, { y: -(msgs.length * 92 - 520), duration: msgs.length * 0.09 + 0.3, ease: "power1.in", immediateRender: false }, W["200"] + 0.25);
      tl.set(msgs, { opacity: 0 }, 0);
      const S = gsap.utils.toArray("#f6-count span");
      S.forEach((s, i) => {
        tl.set(s, { opacity: 1 }, W["200"] - 0.05 + i * 0.075);
        if (i < S.length - 1) tl.set(s, { opacity: 0 }, W["200"] - 0.05 + (i + 1) * 0.075);
      });
      punch("#f6-count", W["200"] - 0.05 + (S.length - 1) * 0.075, 1.15, 0.1);
      tl.fromTo("#f6-badge", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.5)", immediateRender: false }, W.unread - 0.05);
      tl.set(["#f6-badge", "#f6-enq"], { opacity: 0 }, 0);
      tl.fromTo("#f6-enq", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, W.enquiries - 0.05);
      flash(W.enquiries, 0.5, 0.12); shake("#f6", W.enquiries + 0.05, 22, 8);
      tl.fromTo("#f6-badge", { scale: 1 }, { scale: 1.1, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, W.enquiries + 0.3);
      // flash cut into the problem
      tl.fromTo("#f6", { scale: 1.05 }, { scale: 1.16, duration: 0.18, ease: "power3.in", immediateRender: false }, D - 0.18);
      tl.fromTo("#fl", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in", immediateRender: false }, D - 0.12);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
