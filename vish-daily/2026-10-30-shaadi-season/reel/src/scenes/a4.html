<template>
  <style>
    {{BASE_CSS}}
    #a4-g { left: 56px; top: 452px; width: 968px; height: 420px; }
    #a4-ev { margin: 18px 26px 6px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 28px; color: var(--ink); }
    .a4-row { display: flex; align-items: center; gap: 18px; height: 72px; padding: 0 26px; border-top: 2px solid #ECEEF2; font-size: 28px; font-weight: 700; color: #141A24; }
    .a4-ic { width: 46px; height: 46px; border-radius: 12px; background: #FFD43B; flex: none; }
    .a4-ok { margin-left: auto; font-size: 20px; }
  </style>
  <div id="root" data-composition-id="a4" data-width="1080" data-height="1920">
    <div id="a4-bg" class="panel bg-blue"></div>
    <div class="head on-blue" style="color:var(--paper)">
      <div class="mask"><div id="a4-num" class="disp num">{{c.num}}</div></div>
      <div class="ttl disp"><div class="mask"><div id="a4-t1">{{c.title.0}}</div></div><div class="mask"><div id="a4-t2">{{c.title.1}}</div></div></div>
    </div>
    <div id="a4-g" class="card">
      <div class="bar"><span class="dot b"></span>&nbsp;{{c.bar}}</div>
      <div id="a4-ev">{{c.event}}</div>
      <div class="a4-row" id="a4-r1"><span class="a4-ic"></span>{{c.v1}}<span id="a4-k1" class="a4-ok tag blue">Updated ✓</span></div>
      <div class="a4-row" id="a4-r2"><span class="a4-ic"></span>{{c.v2}}<span id="a4-k2" class="a4-ok tag blue">Updated ✓</span></div>
      <div class="a4-row" id="a4-r3"><span class="a4-ic"></span>{{c.v3}}<span id="a4-k3" class="a4-ok tag blue">Updated ✓</span></div>
      <div class="a4-row" id="a4-r4"><span class="a4-ic"></span>{{c.v4}}<span id="a4-k4" class="a4-ok tag blue">Updated ✓</span></div>
    </div>
    {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a4-num", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, W.fourth - 0.04);
      tl.fromTo("#a4-t1", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.vendor - 0.06);
      tl.fromTo("#a4-t2", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.updated - 0.06);
      tl.fromTo("#a4-g", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, W.keeps - 0.1);
      tl.fromTo(["#a4-r1", "#a4-r2", "#a4-r3", "#a4-r4"], { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.2, stagger: 0.08, ease: "power2.out" }, W.every);
      tl.set(["#a4-k1", "#a4-k2", "#a4-k3", "#a4-k4"], { opacity: 0 }, 0);
      // a tick per vendor, from caterer to decorator
      [W.updated + 0.2, W.from + 0.1, W.caterer, W.decorator].forEach((t, i) => {
        tl.fromTo(`#a4-k${i + 1}`, { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.5)", immediateRender: false }, t);
      });
      tl.to("#a4-g", { boxShadow: "0 0 0 6px #F5F5F7, 0 28px 60px rgba(4,8,20,.38)", duration: 0.25 }, W.decorator + 0.25);
      tl.fromTo("#a4-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["a4"] = tl;
    })();
  </script>
</template>
