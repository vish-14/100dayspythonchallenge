<template>
  <style>
    {{BASE_CSS}}
    #pb-card { left: 56px; top: 262px; width: 968px; height: 600px; overflow: visible; }
    .pb-row { position: relative; display: flex; align-items: center; gap: 20px; height: 120px; padding: 0 26px; border-bottom: 2px solid #ECEEF2; }
    .pb-av { width: 70px; height: 70px; border-radius: 50%; background: #FFD43B; flex: none; display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 30px; color: #0B1016; }
    .pb-nm { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 32px; color: var(--ink); }
    .pb-sub { font-family: 'JetBrains Mono', monospace; font-size: 19px; letter-spacing: .1em; color: #5B6372; margin-top: 6px; }
    .pb-ask { margin-left: auto; font-size: 22px; }
    #pb-late { position: absolute; right: -14px; top: -30px; background: var(--ink); color: #fff; font-size: 24px; padding: 10px 18px; }
    #pb-lost { position: absolute; left: 200px; top: 60px; padding: 12px 26px; border: 8px solid #E3262B; color: #E3262B; border-radius: 14px; background: rgba(245,245,247,.94);
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 54px; transform: rotate(-6deg); white-space: nowrap; }
    #pb-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; opacity: 0; pointer-events: none; }
  </style>
  <div id="root" data-composition-id="problem" data-width="1080" data-height="1920">
    <div id="problem-bg" class="panel bg-blue"></div>
    <div id="pb-card" class="card">
      <div class="bar"><span class="dot b"></span><span class="dot"></span><span class="dot"></span>&nbsp;{{c.bar}}</div>
      <div id="pb-r1" class="pb-row"><div class="pb-av">S</div><div><div class="pb-nm">{{c.r1}}</div><div class="pb-sub">{{c.r1s}}</div></div><span id="pb-a1" class="pb-ask tag blue">{{c.a1}}</span></div>
      <div id="pb-r2" class="pb-row"><div class="pb-av">R</div><div><div class="pb-nm">{{c.r2}}</div><div class="pb-sub">{{c.r2s}}</div></div><span id="pb-a2" class="pb-ask tag blue">{{c.a2}}</span></div>
      <div id="pb-r3" class="pb-row"><div class="pb-av">K</div><div><div class="pb-nm">{{c.r3}}</div><div class="pb-sub">{{c.r3s}}</div></div><span id="pb-a3" class="pb-ask tag blue">{{c.a3}}</span></div>
      <div id="pb-r4" class="pb-row" style="border:none"><div class="pb-av">P</div><div><div class="pb-nm">{{c.r4}}</div><div class="pb-sub">{{c.r4s}}</div></div><span id="pb-a4" class="pb-ask tag" style="background:#E3262B;color:#fff">{{c.a4}}</span></div>
      <span id="pb-late" class="tag mono">{{c.late}}</span>
      <div id="pb-lost" data-layout-allow-overlap>{{c.lost}}</div>
    </div>
    {{CHROME}}
    <div id="pb-flash"></div>
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#pb-flash", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power2.out" }, 0);
      tl.fromTo("#pb-card", { opacity: 0, y: 60, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, W.every - 0.1);
      // one family per thing they want: date, package, price, today
      [["#pb-r1", "#pb-a1", W.family], ["#pb-r2", "#pb-a2", W.package], ["#pb-r3", "#pb-a3", W.price], ["#pb-r4", "#pb-a4", W.today]].forEach(([r, a, t]) => {
        tl.fromTo(r, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.24, ease: "power3.out" }, t - 0.06);
        tl.fromTo(a, { scale: 0 }, { scale: 1, duration: 0.2, ease: "back.out(2.5)" }, t + 0.12);
      });
      tl.fromTo("#pb-a1", { scale: 1 }, { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, W.date);
      tl.to("#pb-a4", { opacity: 0.3, duration: 0.15, yoyo: true, repeat: 3, ease: "steps(1)" }, W.today + 0.35);
      // "Reply late": two days pass, the rows go grey
      tl.fromTo("#pb-late", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out" }, W.reply);
      tl.to(["#pb-r1", "#pb-r2", "#pb-r3", "#pb-r4"], { opacity: 0.45, duration: 0.3 }, W.late);
      // "they book the next planner": stamp
      tl.set("#pb-lost", { opacity: 0 }, 0);
      tl.fromTo("#pb-lost", { opacity: 0, scale: 3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, W.book - 0.05);
      tl.fromTo("#pb-flash", { opacity: 0.5 }, { opacity: 0, duration: 0.14, immediateRender: false }, W.book);
      tl.fromTo("#pb-card", { x: 0 }, { x: 14, duration: 0.04, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, W.book + 0.12);
      tl.fromTo("#problem-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["problem"] = tl;
    })();
  </script>
</template>
