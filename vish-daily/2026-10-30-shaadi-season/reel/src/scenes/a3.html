<template>
  <style>
    {{BASE_CSS}}
    #a3-wa { left: 56px; top: 452px; width: 580px; height: 400px; }
    #a3-wa .bar { background: #075E54; color: #fff; border-bottom: none; }
    #a3-bub { margin: 24px 24px 0; padding: 18px 22px; background: #DCF8C6; border-radius: 18px; border-top-right-radius: 4px; font-size: 26px; font-weight: 600; color: #141A24; line-height: 1.3; }
    #a3-polite { margin: 16px 24px 0; font-size: 20px; }
    #a3-pay { left: 660px; top: 452px; width: 364px; height: 400px; padding: 24px; }
    .a3-k { font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: .14em; color: #5B6372; text-transform: uppercase; }
    .a3-v { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 40px; color: var(--ink); margin-top: 8px; }
    #a3-status { position: relative; margin-top: 40px; height: 70px; }
    #a3-status span { position: absolute; left: 0; top: 0; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 34px; padding: 12px 22px; border-radius: 12px; }
    #a3-due { background: #FFF3BF; color: #8A5300; }
    #a3-paid { background: var(--blue); color: #fff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="a3" data-width="1080" data-height="1920">
    <div id="a3-bg" class="panel bg-dark"></div>
    <div class="head" style="color:var(--paper)">
      <div class="mask"><div id="a3-num" class="disp num">{{c.num}}</div></div>
      <div class="ttl disp"><div class="mask"><div id="a3-t1">{{c.title.0}}</div></div><div class="mask"><div id="a3-t2">{{c.title.1}}</div></div></div>
    </div>
    <div id="a3-wa" class="card">
      <div class="bar">&nbsp;{{c.wa}}</div>
      <div id="a3-bub">{{c.msg}}</div>
      <div id="a3-polite"><span class="tag blue">{{c.tag}}</span></div>
    </div>
    <div id="a3-pay" class="card">
      <div class="a3-k">{{c.payk}}</div><div class="a3-v">{{c.payv}}</div>
      <div class="a3-k" style="margin-top:22px">{{c.duek}}</div><div class="a3-v" style="font-size:32px">{{c.duev}}</div>
      <div id="a3-status"><span id="a3-due">{{c.due}}</span><span id="a3-paid">{{c.paid}}</span></div>
    </div>
    {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a3-num", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, W.third - 0.04);
      tl.fromTo("#a3-t1", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.payment - 0.06);
      tl.fromTo("#a3-t2", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.reminders - 0.06);
      tl.fromTo("#a3-pay", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, W.third + 0.2);
      // "sends polite payment reminders"
      tl.fromTo("#a3-wa", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, W.sends - 0.1);
      tl.fromTo("#a3-bub", { opacity: 0, scale: 0.8, transformOrigin: "100% 0%" }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)" }, W.polite - 0.05);
      tl.fromTo("#a3-polite", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2 }, W.reminders);
      tl.fromTo("#a3-due", { scale: 1 }, { scale: 1.1, duration: 0.1, yoyo: true, repeat: 3, immediateRender: false }, W.reminders + 0.1);
      // "advances come in on time": Due flips to Paid
      tl.to("#a3-due", { rotationX: 90, opacity: 0, duration: 0.15, ease: "power2.in" }, W.come - 0.1);
      tl.fromTo("#a3-paid", { rotationX: -90, opacity: 0 }, { rotationX: 0, opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, W.come + 0.05);
      tl.to("#a3-pay", { boxShadow: "0 0 0 6px #2257EF, 0 28px 60px rgba(4,8,20,.38)", duration: 0.25 }, W.time);
      tl.fromTo("#a3-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["a3"] = tl;
    })();
  </script>
</template>
