<template>
  <style>
    {{BASE_CSS}}
    #a1-card { left: 56px; top: 470px; width: 968px; height: 400px; }
    .a1-row { display: flex; align-items: center; height: 78px; padding: 0 26px; border-bottom: 2px solid #ECEEF2; }
    .a1-row b { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 32px; color: var(--ink); }
    .a1-st { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 20px; padding: 8px 14px; border-radius: 10px; background: #D3F9D8; color: #1F7A3A; }
    .a1-st i { width: 14px; height: 14px; border-radius: 50%; background: #2F9E44; }
    #a1-news { position: absolute; right: 70px; top: 420px; padding: 12px 20px; background: #E3262B; color: #fff; font-size: 22px; border-radius: 12px; transform: rotate(4deg); }
    #a1-ok { position: absolute; right: 56px; top: 300px; text-align: right; }
    #a1-ok span { display: inline-block; background: #2F9E44; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 30px; padding: 12px 22px; border-radius: 14px; }
  </style>
  <div id="root" data-composition-id="a1" data-width="1080" data-height="1920">
    <div id="a1-bg" class="panel bg-dark"></div>
    <div class="head" style="color:var(--paper)">
      <div class="mask"><div id="a1-num" class="disp num">{{c.num}}</div></div>
      <div class="ttl disp"><div class="mask"><div id="a1-t1">{{c.title.0}}</div></div><div class="mask"><div id="a1-t2">{{c.title.1}}</div></div></div>
    </div>
    <div id="a1-card" class="card">
      <div class="bar"><span class="dot b"></span><span class="dot"></span><span class="dot"></span>&nbsp;{{c.bar}}</div>
      <div id="a1-r0" class="a1-row"><b>{{c.rows.0}}</b><span class="a1-st mono"><i></i>{{c.running}}</span></div>
      <div id="a1-r1" class="a1-row"><b>{{c.rows.1}}</b><span class="a1-st mono"><i></i>{{c.running}}</span></div>
      <div id="a1-r2" class="a1-row"><b>{{c.rows.2}}</b><span class="a1-st mono"><i></i>{{c.running}}</span></div>
      <div id="a1-r3" class="a1-row" style="border:none"><b>{{c.rows.3}}</b><span class="a1-st mono"><i></i>{{c.running}}</span></div>
    </div>
    <div id="a1-news" class="mono">{{c.news}}</div>
    <div id="a1-ok"><span>{{c.ok}}</span></div>
    {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a1-num", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, W.first - 0.04);
      tl.fromTo("#a1-t1", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.dont - 0.06);
      tl.fromTo("#a1-t2", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.panic - 0.06);
      // your AI tools, all running
      tl.fromTo("#a1-card", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, W.panic + 0.1);
      [0, 1, 2, 3].forEach((i) => tl.fromTo(`#a1-r${i}`, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.22, ease: "power3.out" }, W.panic + 0.25 + i * 0.12));
      // "A CEO change": the news slams in… "doesn't switch off your tools": it bounces off, every light keeps blinking
      tl.set("#a1-news", { opacity: 0 }, 0);
      tl.fromTo("#a1-news", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, W.ceo - 0.05);
      tl.fromTo("#a1-card", { y: 0 }, { y: 12, duration: 0.06, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, W.ceo + 0.1);
      tl.to("#a1-news", { y: -260, x: 120, rotation: 30, opacity: 0, duration: 0.45, ease: "power3.in" }, W.switch);
      gsap.utils.toArray(".a1-st i").forEach((d, i) => tl.fromTo(d, { opacity: 1 }, { opacity: 0.25, duration: 0.3, yoyo: true, repeat: 11, ease: "steps(1)" }, W.panic + 0.4 + i * 0.08));
      // "keeps running"
      tl.fromTo("#a1-ok", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, W.keeps - 0.05);
      tl.fromTo("#a1-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["a1"] = tl;
    })();
  </script>
</template>
