<template>
  <style>
    {{BASE_CSS}}
    #a4-card { left: 56px; top: 470px; width: 968px; height: 410px; }
    #a4-meta { display: flex; align-items: center; gap: 14px; margin: 22px 30px 0; }
    #a4-meta b { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 36px; color: var(--ink); }
    .a4-ln { height: 18px; border-radius: 9px; background: #DADDE4; margin: 18px 30px 0; transform-origin: 0 50%; }
    #a4-btns { position: absolute; left: 30px; right: 30px; bottom: 26px; display: flex; gap: 18px; align-items: center; }
    .a4-btn { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 30px; padding: 16px 30px; border-radius: 14px; }
    #a4-approve { background: var(--blue); color: #fff; }
    #a4-edit { border: 3px solid #C6CBD5; color: #4E5666; }
    #a4-done { margin-left: auto; font-size: 22px; padding: 10px 16px; border-radius: 10px; background: #D3F9D8; color: #1F7A3A; }
    #a4-cursor { position: absolute; left: 0; top: 0; width: 44px; height: 54px; }
  </style>
  <div id="root" data-composition-id="a4" data-width="1080" data-height="1920">
    <div id="a4-bg" class="panel bg-blue"></div>
    <div class="head on-blue" style="color:var(--paper)">
      <div class="mask"><div id="a4-num" class="disp num">{{c.num}}</div></div>
      <div class="ttl disp"><div class="mask"><div id="a4-t1">{{c.title.0}}</div></div><div class="mask"><div id="a4-t2">{{c.title.1}}</div></div></div>
    </div>
    <div id="a4-card" class="card">
      <div class="bar"><span class="dot b"></span><span class="dot"></span><span class="dot"></span>&nbsp;{{c.bar}}</div>
      <div id="a4-meta"><span id="a4-tag" class="tag ink">{{c.tag}}</span><b>{{c.task}}</b></div>
      <div class="a4-ln" style="width:820px"></div><div class="a4-ln" style="width:700px"></div><div class="a4-ln" style="width:760px"></div>
      <div id="a4-btns"><span id="a4-approve" class="a4-btn">{{c.approve}}</span><span id="a4-edit" class="a4-btn">{{c.edit}}</span><span id="a4-done" class="mono">{{c.done}}</span></div>
    </div>
    <svg id="a4-cursor" viewBox="0 0 44 54"><path d="M4 2 L4 44 L15 34 L23 52 L31 48 L23 31 L38 31 Z" fill="#0B1016" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
    {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a4-num", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, W.fourth - 0.04);
      tl.fromTo("#a4-t1", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.human - 0.06);
      tl.fromTo("#a4-t2", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.control - 0.06);
      // "The agent does the work": the draft writes itself
      tl.fromTo("#a4-card", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, W.agent - 0.2);
      gsap.utils.toArray(".a4-ln").forEach((l, i) => tl.fromTo(l, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, W.does + i * 0.18));
      // "and you approve": cursor glides in and clicks Approve
      tl.set("#a4-done", { opacity: 0 }, 0);
      tl.fromTo("#a4-cursor", { x: 900, y: 1000, opacity: 0 }, { x: 170, y: 820, opacity: 1, duration: 0.45, ease: "power3.out" }, W.you - 0.35);
      tl.to("#a4-cursor", { scale: 0.85, duration: 0.06, yoyo: true, repeat: 1 }, W.approve + 0.05);
      tl.to("#a4-approve", { scale: 0.92, duration: 0.06, yoyo: true, repeat: 1 }, W.approve + 0.05);
      tl.to("#a4-approve", { backgroundColor: "#2F9E44", duration: 0.2 }, W.approve + 0.15);
      tl.fromTo("#a4-done", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.5)", immediateRender: false }, W.what);
      tl.to("#a4-card", { boxShadow: "0 0 0 6px #F5F5F7, 0 28px 60px rgba(4,8,20,.38)", duration: 0.25 }, W.matters);
      tl.fromTo("#a4-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["a4"] = tl;
    })();
  </script>
</template>
