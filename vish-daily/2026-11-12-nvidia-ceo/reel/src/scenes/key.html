  <script>
    (() => {
      const W = {{W}};
      const D = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      // "Leaders change.": the seat label flips, the words slam in
      tl.fromTo("#k-seat", { opacity: 0 }, { opacity: 1, duration: 0.2 }, Math.max(0, W.leaders - 0.2));

      tl.fromTo("#k3", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.out" }, W.good - 0.05);

      tl.fromTo("#k-dot", { opacity: 1 }, { opacity: 0.25, duration: 0.3, yoyo: true, repeat: 5, ease: "steps(1)" }, W.running);
      window.__timelines["key"] = tl;
