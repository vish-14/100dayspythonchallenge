<template>
  <style>
    {{BASE_CSS}}
    #rs-h { position: absolute; left: 56px; top: 262px; font-size: 76px; color: var(--paper); }
    .ms { position: absolute; top: 430px; width: 220px; height: 260px; border-radius: 22px; background: var(--paper); box-shadow: 0 24px 50px rgba(4,8,20,.35); padding: 22px 18px; }
    .ms small { display: block; font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: .14em; color: #5B6372; text-transform: uppercase; }
    .ms b { display: block; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 40px; color: var(--ink); line-height: 1.02; margin-top: 8px; }
    .ms p { font-size: 20px; color: #3A4252; margin-top: 10px; line-height: 1.25; font-weight: 600; }
    .ms .ico { width: 64px; height: 64px; border-radius: 16px; margin-top: 14px; }
    #ms1 { left: 56px; } #ms2 { left: 302px; } #ms3 { left: 548px; } #ms4 { left: 794px; }
    #ms4 { background: #76B900; } #ms4 b, #ms4 small, #ms4 p { color: #0B1016; }
    .ar { position: absolute; top: 548px; width: 26px; height: 26px; border-top: 6px solid var(--paper); border-right: 6px solid var(--paper); transform: rotate(45deg); }
    #rs-chart { position: absolute; left: 56px; top: 720px; width: 968px; height: 150px; }
    #rs-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; opacity: 0; pointer-events: none; }
  </style>
  <div id="root" data-composition-id="problem" data-width="1080" data-height="1920">
    <div id="problem-bg" class="panel bg-blue"></div>
    <div id="rs-h" class="disp">{{c.h}}</div>
    <div id="ms1" class="ms"><small>{{c.m1k}}</small><b>{{c.m1}}</b><p>{{c.m1s}}</p></div>
    <div id="ms2" class="ms"><small>{{c.m2k}}</small><b>{{c.m2}}</b><p>{{c.m2s}}</p></div>
    <div id="ms3" class="ms"><small>{{c.m3k}}</small><b>{{c.m3}}</b><p>{{c.m3s}}</p></div>
    <div id="ms4" class="ms"><small>{{c.m4k}}</small><b>{{c.m4}}</b><p>{{c.m4s}}</p></div>
    <i id="ar1" class="ar" style="left:270px"></i><i id="ar2" class="ar" style="left:516px"></i><i id="ar3" class="ar" style="left:762px"></i>
    <svg id="rs-chart" viewBox="0 0 968 150"><path id="rs-line" d="M10 140 C200 138 350 130 480 110 C620 88 760 50 958 10" fill="none" stroke="#F5F5F7" stroke-width="10" stroke-linecap="round"/></svg>
    {{CHROME}}
    <div id="rs-flash"></div>
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rs-flash", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power2.out" }, 0);
      tl.fromTo("#rs-h", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
      // one milestone per beat: Taiwan → Denny's → 1993 → most valuable
      [[1, W.born], [2, W.teenager], [3, W["1993"]], [4, W.most]].forEach(([i, t]) => {
        tl.fromTo(`#ms${i}`, { opacity: 0, y: 60, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(1.8)" }, t - 0.1);
        if (i > 1) tl.fromTo(`#ar${i - 1}`, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.2 }, t - 0.15);
      });
      tl.fromTo("#ms2", { rotation: 0 }, { rotation: 3, duration: 0.08, yoyo: true, repeat: 3, immediateRender: false }, W.dishes);
      tl.fromTo("#ms3", { boxShadow: "0 24px 50px rgba(4,8,20,.35)" }, { boxShadow: "0 0 0 6px #76B900, 0 24px 50px rgba(4,8,20,.35)", duration: 0.25, immediateRender: false }, W.booth);
      // "built it into one of the most valuable companies in the world": the line climbs
      const ln = document.getElementById("rs-line"), L = ln.getTotalLength(); ln.style.strokeDasharray = L;
      tl.fromTo(ln, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut" }, W.built);
      tl.fromTo("#ms4", { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, W.world);
      tl.fromTo("#problem-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["problem"] = tl;
    })();
  </script>
</template>
