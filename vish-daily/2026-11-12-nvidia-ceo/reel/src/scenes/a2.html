<template>
  <style>
    {{BASE_CSS}}
    #a2-card { left: 56px; top: 470px; width: 968px; height: 400px; }
    #a2-agent { position: absolute; left: 30px; top: 120px; width: 260px; height: 200px; border-radius: 20px; background: var(--ink); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    #a2-agent b { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 36px; }
    #a2-agent small { font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: .14em; color: #8A93A3; }
    #a2-wire { position: absolute; left: 290px; top: 218px; width: 150px; height: 6px; background: var(--blue); transform-origin: 0 50%; }
    .a2-m { position: absolute; left: 470px; width: 460px; height: 110px; border-radius: 18px; border: 4px solid #D5D9E1; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: #fff; }
    .a2-m b { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 34px; color: var(--ink); white-space: nowrap; }
    .a2-m i { width: 26px; height: 26px; border-radius: 50%; border: 4px solid #C6CBD5; }
    #a2-mA { top: 90px; } #a2-mB { top: 230px; }
    .a2-w { margin-left: auto; font-size: 15px; letter-spacing: .08em; padding: 6px 10px; border-radius: 8px; background: #FFE3E3; color: #C92A2A; }
    #a2-sel { position: absolute; left: 470px; top: 90px; width: 460px; height: 110px; border-radius: 18px; border: 6px solid var(--blue); box-shadow: 0 0 0 6px rgba(34,87,239,.2); pointer-events: none; }
    #a2-ok { position: absolute; right: 56px; top: 300px; text-align: right; }
    #a2-ok span { display: inline-block; background: var(--paper); color: var(--ink); font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 30px; padding: 12px 22px; border-radius: 14px; }
  </style>
  <div id="root" data-composition-id="a2" data-width="1080" data-height="1920">
    <div id="a2-bg" class="panel bg-blue"></div>
    <div class="head on-blue" style="color:var(--paper)">
      <div class="mask"><div id="a2-num" class="disp num">{{c.num}}</div></div>
      <div class="ttl disp"><div class="mask"><div id="a2-t1">{{c.title.0}}</div></div><div class="mask"><div id="a2-t2">{{c.title.1}}</div></div></div>
    </div>
    <div id="a2-card" class="card">
      <div class="bar"><span class="dot b"></span><span class="dot"></span><span class="dot"></span>&nbsp;{{c.bar}}</div>
      <div id="a2-agent"><b>{{c.agent}}</b><small>{{c.agent_s}}</small></div>
      <div id="a2-wire"></div>
      <div id="a2-mA" class="a2-m"><i></i><b>{{c.ma}}</b><span id="a2-wp" class="a2-w mono">{{c.pricier}}</span><span id="a2-ws" class="a2-w mono" style="margin-left:8px">{{c.slower}}</span></div>
      <div id="a2-mB" class="a2-m"><i></i><b>{{c.mb}}</b></div>
      <div id="a2-sel"></div>
    </div>
    <div id="a2-ok"><span>{{c.ok}}</span></div>
    {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a2-num", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, W.second - 0.04);
      tl.fromTo("#a2-t1", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.lock - 0.06);
      tl.fromTo("#a2-t2", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.model - 0.06);
      tl.fromTo("#a2-card", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, W.i - 0.1);
      tl.fromTo("#a2-wire", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, W.agents);
      tl.fromTo(["#a2-mA", "#a2-mB"], { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.1, ease: "power3.out" }, W.agents + 0.15);
      tl.fromTo("#a2-sel", { opacity: 0 }, { opacity: 1, duration: 0.2 }, W.agents + 0.3);
      // "switch between AI models": the selector flicks A → B → A
      tl.to("#a2-sel", { y: 140, duration: 0.2, ease: "power3.inOut" }, W.switch);
      tl.to("#a2-wire", { rotation: 20, duration: 0.2, ease: "power3.inOut" }, W.switch);
      tl.to("#a2-sel", { y: 0, duration: 0.2, ease: "power3.inOut" }, W.between + 0.1);
      tl.to("#a2-wire", { rotation: -14, duration: 0.2, ease: "power3.inOut" }, W.between + 0.1);
      // "if one gets pricier or slower": Model A turns red
      tl.set("#a2-wp", { opacity: 0 }, 0);
      tl.fromTo("#a2-wp", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.5)", immediateRender: false }, W.pricier - 0.05);
      tl.to("#a2-mA", { borderColor: "#E3262B", duration: 0.2 }, W.pricier);
      tl.set("#a2-ws", { opacity: 0 }, 0);
      tl.fromTo("#a2-ws", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.5)", immediateRender: false }, W.slower - 0.05);
      // "we swap it": selector to B, wire follows
      tl.to("#a2-sel", { y: 140, duration: 0.25, ease: "back.out(1.6)" }, W.swap);
      tl.to("#a2-wire", { rotation: 20, duration: 0.25, ease: "back.out(1.6)" }, W.swap);
      tl.to("#a2-mA", { opacity: 0.45, duration: 0.25 }, W.swap);
      tl.fromTo("#a2-ok", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, W.minutes - 0.05);
      tl.fromTo("#a2-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["a2"] = tl;
    })();
  </script>
</template>
