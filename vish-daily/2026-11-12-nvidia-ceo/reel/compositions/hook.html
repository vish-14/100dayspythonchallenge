  <script>
    (() => {
      // keep every giant word inside a 980 px line
      document.querySelectorAll("#root .fit").forEach((el) => {
        let fs = parseFloat(getComputedStyle(el).fontSize);
        const span = document.createElement("span"); span.textContent = el.textContent; span.style.whiteSpace = "nowrap";
        el.textContent = ""; el.appendChild(span);
        while (span.getBoundingClientRect().width > 980 && fs > 40) { fs -= 4; el.style.fontSize = fs + "px"; }
      });
      const W = {"breaking": 1.3, "breaking_end": 1.76, "news": 1.76, "news_end": 2.4, "jensen": 2.4, "jensen_end": 2.96, "huang": 3.12, "huang_end": 3.52, "just": 3.76, "just_end": 4.0, "resigned": 4.0, "resigned_end": 4.56, "as": 4.56, "as_end": 4.8, "nvidias": 4.8, "nvidias_end": 5.52, "ceo": 5.76, "ceo_end": 7.04, "heres": 7.04, "heres_end": 7.44, "what": 7.44, "what_end": 7.6, "it": 7.6, "it_end": 7.76, "means": 7.76, "means_end": 8.08, "for": 8.08, "for_end": 8.24, "your": 8.24, "your_end": 8.4, "business": 8.4, "business_end": 9.2};
      const D = 9.211;
      const tl = gsap.timeline({ paused: true });
      const F = ["#f1", "#f2", "#f3", "#f4", "#f5", "#f6"];
      const flash = (t, o = 0.85, d = 0.14) => tl.fromTo("#fl", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
      const shake = (sel, t, amp = 16, n = 6) => {
        for (let i = 0; i < n; i++) { const a = amp * (1 - i / n); tl.to(sel, { x: (i % 2 ? -1 : 1) * a, y: (i % 3 - 1) * a * 0.6, duration: 0.035, ease: "none" }, t + i * 0.035); }
        tl.to(sel, { x: 0, y: 0, duration: 0.05, ease: "none" }, t + n * 0.035);
      };
      const cut = (i, t, punch = 1.18, fl = 0.8, sh = 14) => {
        F.forEach((f, j) => tl.set(f, { visibility: j === i ? "visible" : "hidden" }, t));
        tl.fromTo(F[i], { scale: punch }, { scale: 1, duration: 0.28, ease: "power4.out", immediateRender: false }, t);
        tl.to(F[i], { scale: 1.05, duration: 2.6, ease: "none" }, t + 0.3);
        if (fl) flash(t, fl);
        if (sh) shake(F[i], t + 0.08, sh);
      };
      // sting hits: 0.00 BREAKING (frame 0 is the thumbnail: readable, no flash), 0.35 NEWS, 0.70 ALERT
      cut(0, 0, 1.0, 0, 0);
      shake("#f1", 0.05, 18);
      tl.fromTo("#f1 .big", { scale: 1 }, { scale: 1.12, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 0.04);
      cut(1, 0.35, 1.45, 0.9, 22);
      cut(2, 0.70, 1.2, 0.9, 18);
      for (let k = 0; 0.70 + k * 0.1 < W.breaking; k++) tl.set("#f3-strobe", { backgroundColor: k % 2 ? "#2F6BFF" : "#E3262B", opacity: k % 3 === 2 ? 0.2 : 1 }, 0.70 + k * 0.1);
      tl.fromTo("#f3-alert", { scale: 0.3 }, { scale: 1, duration: 0.22, ease: "back.out(2.6)", immediateRender: false }, 0.72);
      // "Breaking news.": the TV desk, ticker running
      cut(3, W.breaking - 0.04, 1.2, 0.6, 12);
      tl.fromTo("#f4-band", { scaleX: 0.2 }, { scaleX: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, W.breaking);
      tl.fromTo("#f4-dot", { opacity: 1 }, { opacity: 0.15, duration: 0.25, yoyo: true, repeat: 5, ease: "steps(1)" }, W.breaking);
      tl.fromTo("#f4-run", { x: 0 }, { x: -260, duration: W.jensen - W.breaking + 0.2, ease: "none" }, W.breaking);
      // "Jensen Huang just resigned as Nvidia's CEO": the name card, stamped on "resigned"
      cut(4, W.jensen - 0.05, 1.3, 0.5, 14);
      tl.fromTo("#f5-card", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, W.jensen + 0.05);
      tl.set("#f5-stamp", { opacity: 0 }, 0);
      tl.fromTo("#f5-stamp", { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.out", immediateRender: false }, W.resigned - 0.02);
      flash(W.resigned, 0.45, 0.12); shake("#f5", W.resigned + 0.04, 20, 7);
      tl.fromTo("#f5 .l2", { scale: 1 }, { scale: 1.08, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, W.ceo);
      // "Here's what it means for your business."
      cut(5, W.heres - 0.05, 1.3, 0.6, 14);
      tl.fromTo("#f6-q", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, W.business - 0.05);
      tl.fromTo("#f6-q", { scale: 1 }, { scale: 1.1, duration: 0.14, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, W.business + 0.3);
      gsap.utils.toArray("#root .stripes").forEach((s) => tl.fromTo(s, { x: 0 }, { x: -180, duration: D, ease: "none" }, 0));
      // siren layer: lights alternate fast until the name, then keep pulsing; edge glow swaps red/blue; LIVE blinks; alert pings
      const B = gsap.utils.toArray("#ov-bar i");
      for (let k = 0; k * 0.11 < D - 0.2; k++) {
        const fast = k * 0.11 < W.jensen;
        if (!fast && k % 2) continue;
        B.forEach((el, i) => tl.set(el, { opacity: (i + k) % 2 ? 1 : 0.12 }, k * 0.11));
        tl.set("#ov-glow", { boxShadow: (k % 2 ? "inset 0 0 120px 30px rgba(47,107,255,.55)" : "inset 0 0 120px 30px rgba(227,38,43,.6)") }, k * 0.11);
      }
      tl.fromTo("#ov-live", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, 0.7);
      tl.fromTo("#ov-dot", { opacity: 1 }, { opacity: 0.15, duration: 0.25, yoyo: true, repeat: 30, ease: "steps(1)" }, 0.7);
      [0.7, W.jensen, W.resigned, W.heres].forEach((t) => tl.fromTo("#ov-alert", { scale: 1.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.5)", immediateRender: false }, t));
      tl.set("#ov-alert", { opacity: 0 }, 0);
      // flash out into the problem
      tl.fromTo("#f6", { scale: 1 }, { scale: 1.14, duration: 0.18, ease: "power3.in", immediateRender: false }, D - 0.18);
      tl.fromTo("#fl", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in", immediateRender: false }, D - 0.12);
      window.__timelines["hook"] = tl;
