<style>

#l1{top:478px;font-size:100px;color:#F5F5F7}

#panel{position:absolute;top:1010px;left:0;width:1080px;height:910px;background:#2257EF;overflow:hidden}
#panel img{position:absolute;left:0;top:-10px;width:1080px;height:920px;image-rendering:pixelated}
