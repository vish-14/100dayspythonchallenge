<template>
  <style>
    {{BASE_CSS}}
    .fr { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; visibility: hidden; transform-origin: 50% 36%; }
    .big { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
    .stripes { position: absolute; left: -200px; top: 0; width: 1480px; height: 1920px; opacity: .07; background: repeating-linear-gradient(135deg, #F5F5F7 0 26px, transparent 26px 64px); }
    .sub { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 30px; }
    /* F1 BREAKING on red */
    #f1 { background: #E3262B; } #f1 .big { top: 560px; font-size: 200px; color: #fff; }
    #f1 .sub { top: 800px; color: rgba(255,255,255,.85); }
    /* F2 NEWS on black */
    #f2 { background: #0B1016; } #f2 .big { top: 500px; font-size: 330px; color: #E3262B; }
    /* F3 strobe alert */
    #f3 { background: #0B1016; }
    #f3-strobe { position: absolute; inset: 0; background: #E3262B; }
    #f3-alert { position: absolute; left: 340px; top: 400px; width: 400px; height: 400px; border-radius: 50%; background: #fff; color: #E3262B;
      display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 300px; line-height: 1; box-shadow: 0 0 0 26px rgba(255,255,255,.3); }
    #f3 .sub { top: 1110px; color: #fff; font-size: 36px; font-weight: 700; }
    /* F4 TV news desk */
    #f4 { background: #0B1016; }
    #f4-lights { position: absolute; left: 56px; top: 330px; width: 968px; height: 60px; display: flex; gap: 12px; }
    .lt { flex: 1; border-radius: 10px; }
    .lt.r { background: #E3262B; box-shadow: 0 0 34px 8px rgba(227,38,43,.75); }
    .lt.b { background: #2F6BFF; box-shadow: 0 0 34px 8px rgba(47,107,255,.8); }
    #f4-band { position: absolute; left: 0; top: 470px; width: 1080px; height: 190px; background: #E3262B; display: flex; flex-direction: column; justify-content: center; padding: 0 56px; }
    #f4-band b { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 104px; color: #fff; line-height: 1; }
    #f4-live { position: absolute; right: 56px; top: 22px; display: flex; align-items: center; gap: 10px; color: #fff; font-size: 26px; font-weight: 700; }
    #f4-dot { width: 20px; height: 20px; border-radius: 50%; background: #fff; }
    #f4-tick { position: absolute; left: 0; top: 660px; width: 1080px; height: 76px; background: var(--paper); overflow: hidden; }
    #f4-tag { position: absolute; left: 0; top: 0; height: 76px; padding: 0 22px; background: var(--blue); color: #fff; display: flex; align-items: center; font-size: 24px; z-index: 2; }
    #f4-run { position: absolute; left: 270px; top: 0; height: 76px; display: flex; align-items: center; white-space: nowrap; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 34px; color: var(--ink); }
    #f4-time { position: absolute; left: 0; width: 1080px; top: 1120px; text-align: center; color: #8A93A3; font-size: 30px; }
    /* F5 AAJ RAAT SE */
    #f5 { background: #0B1016; } #f5 .big { top: 560px; font-size: 170px; color: var(--paper); }
    #f5-bar { position: absolute; left: 140px; top: 760px; width: 800px; height: 14px; background: #E3262B; transform-origin: 0 50%; }
    /* F6 KOI ENQUIRY */
    #f6 { background: #111826; } #f6 .big { top: 540px; font-size: 168px; color: var(--paper); }
    #f6-note { position: absolute; left: 120px; top: 1110px; width: 840px; height: 130px; background: var(--paper); border-radius: 26px; display: flex; align-items: center; gap: 24px; padding: 0 30px; box-shadow: 0 28px 60px rgba(0,0,0,.5); }
    #f6-ico { width: 80px; height: 80px; border-radius: 20px; background: var(--blue); flex: none; }
    #f6-note b { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 34px; color: var(--ink); }
    #f6-note small { display: block; font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: .14em; color: #5B6372; margin-bottom: 6px; }
    /* F7 THANDI NAHI! */
    #f7 { background: #0B1016; } #f7 .big { top: 540px; font-size: 168px; }
    #f7-main { color: #9DB8FF; }
    #f7-g1 { color: #FF2A55; mix-blend-mode: screen; opacity: 0; } #f7-g2 { color: #22E5FF; mix-blend-mode: screen; opacity: 0; }
    #f7-frost { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 35%, rgba(157,184,255,.55), rgba(157,184,255,0) 70%); }
    #fl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; opacity: 0; pointer-events: none; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-bg" class="full bg-dark"></div>
    <div id="f1" class="fr"><div class="stripes"></div><div class="big fit">BREAKING</div><div class="sub mono">{{c.f1sub}}</div></div>
    <div id="f2" class="fr"><div class="stripes"></div><div class="big fit">NEWS</div></div>
    <div id="f3" class="fr"><div id="f3-strobe"></div><div id="f3-alert">!</div><div class="sub mono">{{c.alert}}</div></div>
    <div id="f4" class="fr"><div class="stripes"></div>
      <div id="f4-lights"><i class="lt r"></i><i class="lt b"></i><i class="lt r"></i><i class="lt b"></i><i class="lt r"></i><i class="lt b"></i><i class="lt r"></i><i class="lt b"></i></div>
      <div id="f4-band"><b>BREAKING<br>NEWS</b><span id="f4-live" class="mono"><span id="f4-dot"></span>LIVE</span></div>
      <div id="f4-tick"><div id="f4-tag" class="mono">{{c.tick_tag}}</div><div id="f4-run" data-layout-allow-overlap>{{c.ticker}} &nbsp;·&nbsp; {{c.ticker}}</div></div>
      <div id="f4-time" class="mono">{{c.f4sub}}</div></div>
    <div id="f5" class="fr"><div class="stripes"></div><div class="big fit">{{c.l1}}</div><div id="f5-bar"></div></div>
    <div id="f6" class="fr"><div class="stripes"></div><div class="big fit">{{c.l2}}</div>
      <div id="f6-note"><div id="f6-ico"></div><div><small>{{c.note_k}}</small><b>{{c.note_v}}</b></div></div></div>
    <div id="f7" class="fr"><div id="f7-frost"></div><div id="f7-g1" class="big fit" data-layout-allow-overlap>{{c.l3}}</div><div id="f7-g2" class="big fit" data-layout-allow-overlap>{{c.l3}}</div><div id="f7-main" class="big fit" data-layout-allow-overlap>{{c.l3}}</div></div>
    <div id="fl"></div>
  </div>
  <script>
    (() => {
      // keep every giant word inside a 980 px line
      document.querySelectorAll("#root .fit").forEach((el) => {
        let fs = parseFloat(getComputedStyle(el).fontSize);
        const span = document.createElement("span"); span.textContent = el.textContent; span.style.whiteSpace = "nowrap";
        el.textContent = ""; el.appendChild(span);
        while (span.getBoundingClientRect().width > 980 && fs > 40) { fs -= 4; el.style.fontSize = fs + "px"; }
      });
      const W = {{W}};
      const D = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      const F = ["#f1", "#f2", "#f3", "#f4", "#f5", "#f6", "#f7"];
      const flash = (t, o = 0.85, d = 0.14) => tl.fromTo("#fl", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
      const shake = (sel, t, amp = 16, n = 6) => {
        for (let i = 0; i < n; i++) {
          const a = amp * (1 - i / n);
          tl.to(sel, { x: (i % 2 ? -1 : 1) * a, y: (i % 3 - 1) * a * 0.6, duration: 0.035, ease: "none" }, t + i * 0.035);
        }
        tl.to(sel, { x: 0, y: 0, duration: 0.05, ease: "none" }, t + n * 0.035);
      };
      // hard cut: only one frame visible, with a zoom punch, flash and shake
      const cut = (i, t, punch = 1.18, fl = 0.8, sh = 14) => {
        F.forEach((f, j) => tl.set(f, { visibility: j === i ? "visible" : "hidden" }, t));
        tl.fromTo(F[i], { scale: punch }, { scale: 1, duration: 0.28, ease: "power4.out", immediateRender: false }, t);
        if (fl) flash(t, fl);
        if (sh) shake(F[i], t + 0.08, sh);
      };
      // the three sting hits: 0.00 BREAKING, 0.35 NEWS, 0.70 ALERT (siren)
      cut(0, 0, 1.35, 1, 18);
      tl.fromTo("#f1 .big", { scale: 1.6 }, { scale: 1, duration: 0.18, ease: "power4.out", immediateRender: false }, 0);
      cut(1, 0.35, 1.45, 0.9, 22);
      cut(2, 0.70, 1.2, 0.9, 18);
      for (let k = 0; 0.70 + k * 0.1 < W.breaking; k++) {
        tl.set("#f3-strobe", { backgroundColor: k % 2 ? "#2F6BFF" : "#E3262B", opacity: k % 3 === 2 ? 0.2 : 1 }, 0.70 + k * 0.1);
      }
      tl.fromTo("#f3-alert", { scale: 0.3 }, { scale: 1, duration: 0.22, ease: "back.out(2.6)", immediateRender: false }, 0.72);
      tl.fromTo("#f3-alert", { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 0.95);
      // the voice starts: TV news frame
      cut(3, W.breaking - 0.04, 1.2, 0.6, 12);
      const L = gsap.utils.toArray("#f4-lights .lt");
      for (let k = 0; W.breaking + k * 0.12 < W.aaj; k++) L.forEach((el, i) => tl.set(el, { opacity: (i + k) % 2 ? 1 : 0.15 }, W.breaking + k * 0.12));
      tl.fromTo("#f4-band", { scaleX: 0.2 }, { scaleX: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, W.breaking);
      tl.fromTo("#f4-dot", { opacity: 1 }, { opacity: 0.15, duration: 0.25, yoyo: true, repeat: 7, ease: "steps(1)" }, W.breaking);
      tl.fromTo("#f4-run", { x: 0 }, { x: -700, duration: 2, ease: "none" }, W.breaking);
      // fast cuts on the headline words
      cut(4, W.aaj - 0.05, 1.3, 0.5, 14);
      tl.fromTo("#f5-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, W.aaj + 0.1);
      cut(5, W.koi - 0.05, 1.3, 0.5, 14);
      tl.fromTo("#f6-note", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, W.property - 0.05);
      tl.fromTo("#f6-note", { rotation: 0 }, { rotation: 2, duration: 0.05, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, W.enquiry);
      cut(6, W.thandi - 0.05, 1.5, 0.75, 26);
      [["#f7-g1", -16], ["#f7-g2", 16]].forEach(([g, dx]) => tl.fromTo(g, { opacity: 0.9, x: dx }, { opacity: 0, x: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, W.thandi + 0.05));
      tl.fromTo("#f7-frost", { opacity: 1 }, { opacity: 0.35, duration: 0.7, ease: "power2.out", immediateRender: false }, W.thandi);
      tl.fromTo("#f7-main", { scale: 1 }, { scale: 1.07, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, W.nahi);
      gsap.utils.toArray("#root .stripes").forEach((s) => tl.fromTo(s, { x: 0 }, { x: -180, duration: D, ease: "none" }, 0));
      // flash out into the problem
      tl.fromTo("#f7", { scale: 1 }, { scale: 1.14, duration: 0.18, ease: "power3.in", immediateRender: false }, D - 0.18);
      tl.fromTo("#fl", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in", immediateRender: false }, D - 0.12);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
