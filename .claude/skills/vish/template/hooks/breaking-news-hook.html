          <path d="M250 300 C170 300 70 250 40 170 C30 140 60 125 80 150 L120 200 C90 150 70 110 85 95 C100 82 118 95 130 120 L160 175 C140 120 135 80 155 75 C172 70 182 95 190 125 L205 180 C200 140 205 110 222 108 C240 106 245 140 245 175 Z"

  <script>
    (() => {
      // keep every giant word inside a 980 px line
      document.querySelectorAll("#root .fit").forEach((el) => {
        let fs = parseFloat(getComputedStyle(el).fontSize);
        const span = document.createElement("span"); span.textContent = el.textContent; span.style.whiteSpace = "nowrap";
        el.textContent = ""; el.appendChild(span);
        while (span.getBoundingClientRect().width > 980 && fs > 40) { fs -= 4; el.style.fontSize = fs + "px"; }
      });
      const W = {{W}};
      const D = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      const F = ["#f1", "#f2", "#f3", "#f4", "#f5", "#f6", "#f7"];
      const flash = (t, o = 0.85, d = 0.14) => tl.fromTo("#fl", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
      const shake = (sel, t, amp = 16, n = 6) => {
        for (let i = 0; i < n; i++) {
          const a = amp * (1 - i / n);
          tl.to(sel, { x: (i % 2 ? -1 : 1) * a, y: (i % 3 - 1) * a * 0.6, duration: 0.035, ease: "none" }, t + i * 0.035);
        }
        tl.to(sel, { x: 0, y: 0, duration: 0.05, ease: "none" }, t + n * 0.035);
      };
      // hard cut: only one frame visible, with a zoom punch, flash and shake
      const cut = (i, t, punch = 1.18, fl = 0.8, sh = 14) => {
        F.forEach((f, j) => tl.set(f, { visibility: j === i ? "visible" : "hidden" }, t));
        tl.fromTo(F[i], { scale: punch }, { scale: 1, duration: 0.28, ease: "power4.out", immediateRender: false }, t);
        tl.to(F[i], { scale: 1.05, duration: 2.2, ease: "none" }, t + 0.3);   // slow drift so no frame ever sits still
        if (fl) flash(t, fl);
        if (sh) shake(F[i], t + 0.08, sh);
      };
      // the three sting hits: 0.00 BREAKING, 0.35 NEWS, 0.70 ALERT (siren)
      cut(0, 0, 1.0, 0, 0);  // frame 0 is the thumbnail people see before swiping: fully readable, no flash
      shake("#f1", 0.05, 18);
      tl.fromTo("#f1 .big", { scale: 1 }, { scale: 1.12, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 0.04);
      cut(1, 0.35, 1.45, 0.9, 22);
      cut(2, 0.70, 1.2, 0.9, 18);
      for (let k = 0; 0.70 + k * 0.1 < W.breaking; k++) {
        tl.set("#f3-strobe", { backgroundColor: k % 2 ? "#2F6BFF" : "#E3262B", opacity: k % 3 === 2 ? 0.2 : 1 }, 0.70 + k * 0.1);
      }
      tl.fromTo("#f3-alert", { scale: 0.3 }, { scale: 1, duration: 0.22, ease: "back.out(2.6)", immediateRender: false }, 0.72);
      tl.fromTo("#f3-alert", { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 0.95);
      // the voice starts: TV news frame
      cut(3, W.breaking - 0.04, 1.2, 0.6, 12);
      const L = gsap.utils.toArray("#f4-lights .lt");
      for (let k = 0; W.breaking + k * 0.12 < W.aaj; k++) L.forEach((el, i) => tl.set(el, { opacity: (i + k) % 2 ? 1 : 0.15 }, W.breaking + k * 0.12));
      tl.fromTo("#f4-band", { scaleX: 0.2 }, { scaleX: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, W.breaking);
      tl.fromTo("#f4-dot", { opacity: 1 }, { opacity: 0.15, duration: 0.25, yoyo: true, repeat: 7, ease: "steps(1)" }, W.breaking);
      tl.fromTo("#f4-run", { x: 0 }, { x: -700, duration: 2, ease: "none" }, W.breaking);
      // fast cuts on the headline words
      cut(4, W.aaj - 0.05, 1.3, 0.5, 14);
      tl.fromTo("#f5-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, W.aaj + 0.1);
      // "aaj raat se": the moon rises, the clock ticks to 11:00 PM
      tl.fromTo("#f5-moon", { y: 60, opacity: 0, rotation: -60 }, { y: 0, opacity: 1, rotation: -20, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, W.aaj + 0.2);
      tl.fromTo("#f5-time", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, W.aaj + 0.3);
      const TS = gsap.utils.toArray("#f5-time span");
      TS.forEach((el, i) => {
        const t0 = W.aaj + 0.3 + i * 0.42;
        tl.fromTo(el, { yPercent: 100, opacity: 1 }, { yPercent: 0, duration: 0.14, ease: "power3.out", immediateRender: false }, t0);
        if (i < TS.length - 1) tl.to(el, { yPercent: -100, duration: 0.14, ease: "power3.in" }, t0 + 0.42);
      });
      tl.fromTo("#f5-time", { scale: 1 }, { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, W.aaj + 0.3 + 2 * 0.42);
      cut(5, W.ek - 0.05, 1.3, 0.5, 14);
      tl.fromTo("#f6-note", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, W.lead - 0.05);
      tl.fromTo("#f6-note", { rotation: 0 }, { rotation: 2, duration: 0.05, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, W.lead + 0.35);
      cut(6, W.haath - 0.05, 1.5, 0.75, 26);
      [["#f7-g1", -16], ["#f7-g2", 16]].forEach(([g, dx]) => tl.fromTo(g, { opacity: 0.9, x: dx }, { opacity: 0, x: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, W.nahi + 0.05));
      tl.fromTo("#f7-frost", { opacity: 1 }, { opacity: 0.35, duration: 0.7, ease: "power2.out", immediateRender: false }, W.haath);
      tl.fromTo("#f7-main", { scale: 1 }, { scale: 1.07, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, W.jayega);
      gsap.utils.toArray("#root .stripes").forEach((s) => tl.fromTo(s, { x: 0 }, { x: -180, duration: D, ease: "none" }, 0));
      // siren layer: lights alternate fast during the siren, then keep pulsing; edge glow swaps red/blue; LIVE blinks; alert pings
      const B = gsap.utils.toArray("#ov-bar i");
      for (let k = 0; k * 0.11 < D - 0.2; k++) {
        const fast = k * 0.11 < W.aaj;
        if (!fast && k % 2) continue;
        B.forEach((el, i) => tl.set(el, { opacity: (i + k) % 2 ? 1 : 0.12 }, k * 0.11));
        tl.set("#ov-glow", { boxShadow: (k % 2 ? "inset 0 0 120px 30px rgba(47,107,255,.55)" : "inset 0 0 120px 30px rgba(227,38,43,.6)") }, k * 0.11);
      }
      tl.fromTo("#ov-live", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, 0.7);
      tl.fromTo("#ov-dot", { opacity: 1 }, { opacity: 0.15, duration: 0.25, yoyo: true, repeat: 20, ease: "steps(1)" }, 0.7);
      [0.7, W.aaj, W.ek, W.haath].forEach((t) => tl.fromTo("#ov-alert", { scale: 1.8, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.5)", immediateRender: false }, t));
      tl.set("#ov-alert", { opacity: 0 }, 0);
      // "haath se nahi jayega": the lead slips out of the hands, a red ✕ stops it, the hands grip it, ✓ SECURED
      const H = W.haath;
      tl.fromTo("#f7-hands", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "back.out(1.6)" }, H - 0.02);
      tl.fromTo("#f7-card", { scale: 0.3, opacity: 0, rotation: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.2)" }, H + 0.08);
      tl.set(["#f7-x", "#f7-ok"], { opacity: 0 }, 0);
      tl.to("#f7-card", { rotation: 24, x: 150, y: 120, duration: 0.32, ease: "power2.in" }, H + 0.34);                 // slipping out…
      tl.to("#f7-hl", { rotation: -8, duration: 0.3, ease: "power2.in" }, H + 0.34);
      tl.to("#f7-hr", { rotation: 10, duration: 0.3, ease: "power2.in" }, H + 0.34);
      tl.fromTo("#f7-x", { scale: 2.6, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.18, ease: "power4.out", immediateRender: false }, H + 0.62);   // STOP
      flash(H + 0.64, 0.5, 0.12); shake("#f7", H + 0.66, 18, 6);
      tl.to("#f7-card", { rotation: 0, x: 0, y: 0, duration: 0.2, ease: "back.out(2)" }, H + 0.86);                       // snaps back
      tl.to("#f7-x", { scale: 0.3, opacity: 0, duration: 0.14, ease: "power3.in" }, H + 0.9);
      tl.to("#f7-hl", { rotation: 5, x: 10, duration: 0.18, ease: "power3.out" }, H + 0.9);                                    // grip
      tl.to("#f7-hr", { rotation: -5, x: -10, duration: 0.18, ease: "power3.out" }, H + 0.9);
      tl.fromTo("#f7-ok", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(2.8)", immediateRender: false }, H + 1.0);
      flash(H + 1.0, 0.35, 0.12);
      tl.fromTo("#f7-ok", { scale: 1 }, { scale: 1.1, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, H + 1.26);
      // flash out into the problem
      tl.fromTo("#f7", { scale: 1 }, { scale: 1.14, duration: 0.18, ease: "power3.in", immediateRender: false }, D - 0.18);
      tl.fromTo("#fl", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in", immediateRender: false }, D - 0.12);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
