<template>
  <style>
    {{BASE_CSS}}
    #a1-steps { position: absolute; left: 56px; top: 444px; display: flex; gap: 14px; align-items: center; font-size: 20px; color: var(--gray); }
    #a1-steps b { font-weight: 500; padding: 7px 12px; border-radius: 8px; border: 2px solid var(--gray-line); }
    #a1-steps em { font-style: normal; color: var(--gray); }
    .a1-lbl { font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: .14em; color: #5B6372; text-transform: uppercase; }
    .a1-val { font-size: 25px; font-weight: 700; color: #141A24; margin-top: 4px; }
    .a1-crmrow { padding: 12px 22px; border-bottom: 2px solid #ECEEF2; height: 74px; }
    .a1-chip { position: absolute; padding: 8px 14px; border-radius: 10px; background: #DCE5FD; color: #12307F; font-weight: 700; font-size: 24px; white-space: nowrap; }
    #a1-stamp { position: absolute; right: 18px; top: 10px; }
    .a1-line { font-size: 30px; font-weight: 600; color: #141A24; margin: 18px 30px 0; white-space: nowrap; }
    #a1-review { left: 70px; top: 750px; width: 940px; height: 132px; display: flex; align-items: center; gap: 22px; padding: 0 26px; }
    #a1-who { width: 70px; height: 70px; border-radius: 50%; background: var(--ink); position: relative; flex: none; }
    #a1-who::before { content: ""; position: absolute; left: 23px; top: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); }
    #a1-who::after { content: ""; position: absolute; left: 13px; top: 40px; width: 44px; height: 22px; border-radius: 22px 22px 6px 6px; background: var(--paper); }
    .a1-btn { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 26px; padding: 14px 26px; border-radius: 14px; }
    #a1-approve { background: var(--blue); color: #fff; position: relative; min-width: 236px; text-align: center; }
    #a1-edit { border: 3px solid #C6CBD5; color: #4E5666; margin-left: auto; white-space: nowrap; }
    #a1-cursor { position: absolute; left: 0; top: 0; width: 44px; height: 54px; }
  </style>
  <div id="root" data-composition-id="a1" data-width="1080" data-height="1920">
    <div id="a1-bg" class="panel bg-dark"></div>
    <div class="head" style="color:var(--paper)">
      <div class="mask"><div id="a1-num" class="disp num">{{c.num}}</div></div>
      <div class="ttl disp"><div class="mask"><div id="a1-t1">{{c.title.0}}</div></div><div class="mask"><div id="a1-t2">{{c.title.1}}</div></div></div>
    </div>
    <div id="a1-steps" class="mono"><b id="a1-s1">{{c.steps.0}}</b><em>→</em><b id="a1-s2">{{c.steps.1}}</b><em>→</em><b id="a1-s3">{{c.steps.2}}</b><em>→</em><b id="a1-s4">{{c.steps.3}}</b></div>

    <div id="a1-enq" class="card" style="left:56px;top:510px;width:560px;height:330px">
      <div class="bar"><span class="dot b"></span><span class="dot"></span><span class="dot"></span>&nbsp;New portal lead</div>
      <div style="padding:18px 24px">
        <div class="a1-lbl">From</div><div id="a1-from" class="a1-val">{{c.from}}</div>
        <div class="a1-lbl" style="margin-top:10px">Source</div><div id="a1-mail" class="a1-val" style="font-family:'JetBrains Mono',monospace;font-size:21px">{{c.src}}</div>
        <div class="a1-val" style="margin-top:14px;font-weight:600;font-size:23px;color:#2A3242;white-space:normal;line-height:1.25">“{{c.message}}”</div>
      </div>
    </div>
    <div id="a1-crm" class="card" style="left:646px;top:510px;width:378px;height:330px">
      <div class="bar"><span class="dot b"></span>&nbsp;CRM · contact</div>
      <div class="a1-crmrow"><div class="a1-lbl">Name</div><div id="a1-cn" class="a1-val">{{c.from}}</div></div>
      <div class="a1-crmrow"><div class="a1-lbl">Source</div><div id="a1-ce" class="a1-val">Property portal</div></div>
      <div class="a1-crmrow" style="border:none"><div class="a1-lbl">Status</div><div id="a1-cs" class="a1-val">New lead</div></div>
      <div id="a1-stamp" class="tag blue">Saved ✓</div>
    </div>
    <div id="a1-chip1" class="a1-chip" style="left:72px;top:600px">{{c.from}}</div>
    <div id="a1-chip2" class="a1-chip" style="left:72px;top:672px">Property portal</div>

    <div id="a1-draft" class="card" style="left:56px;top:500px;width:968px;height:236px">
      <div class="bar"><span class="tag blue" style="padding:4px 10px">AI reply</span>&nbsp;To {{c.from}} · portal chat</div>
      <div id="a1-d1" class="a1-line">{{c.draft.0}}</div>
      <div id="a1-d2" class="a1-line">{{c.draft.1}}</div>
      <div id="a1-d3" class="a1-line" style="color:#4E5666">{{c.draft.2}}</div>
    </div>
    <div id="a1-review" class="card">
      <div id="a1-who"></div>
      <div><div class="tag ink">Auto-reply</div><div class="a1-val" style="margin-top:8px;font-size:24px">Your templates, your rules</div></div>
      <div id="a1-edit" class="a1-btn">{{c.tone}}</div>
      <div id="a1-approve" class="a1-btn"><span id="a1-ap1">Sending…</span><span id="a1-ap2" style="position:absolute;left:0;right:0;top:14px;opacity:0">{{c.sent}}</span></div>
    </div>
        {{CHROME}}
  </div>
  <script>
    (() => {
      const W = {{W}};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a1-num", { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, W.first - 0.04);
      tl.fromTo("#a1-t1", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.respond - 0.04);
      tl.fromTo("#a1-t2", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, W.enquiries - 0.08);
      tl.fromTo("#a1-steps", { opacity: 0 }, { opacity: 1, duration: 0.3 }, W.respond);
      const step = (id, t) => {
        tl.to(id, { backgroundColor: "#2257EF", borderColor: "#2257EF", color: "#FFFFFF", duration: 0.2 }, t);
      };
      // a portal lead arrives
      tl.fromTo("#a1-enq", { x: 420, opacity: 0, rotation: 4 }, { x: 0, opacity: 1, rotation: 0, duration: 0.5, ease: "expo.out" }, W.portals - 0.1);
      step("#a1-s1", W.portals);
      // "lands in your CRM": name and source fly into the record
      tl.fromTo("#a1-crm", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, W.from - 0.1);
      tl.set(["#a1-cn", "#a1-ce", "#a1-cs"], { opacity: 0 }, 0);
      tl.fromTo("#a1-chip1", { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.1 }, W.lands - 0.1);
      tl.to("#a1-chip1", { x: 596, y: 4, duration: 0.45, ease: "power3.inOut" }, W.lands);
      tl.set("#a1-chip1", { opacity: 0 }, W.lands + 0.45); tl.set("#a1-cn", { opacity: 1 }, W.lands + 0.45);
      tl.fromTo("#a1-chip2", { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.1 }, W.lands + 0.15);
      tl.to("#a1-chip2", { x: 596, y: -4, duration: 0.45, ease: "power3.inOut" }, W.lands + 0.25);
      tl.set("#a1-chip2", { opacity: 0 }, W.lands + 0.7); tl.set("#a1-ce", { opacity: 1 }, W.lands + 0.7);
      tl.set("#a1-cs", { opacity: 1 }, W.crm - 0.05);
      tl.fromTo("#a1-stamp", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(2)" }, W.crm);
      step("#a1-s2", W.crm);
      // "AI sends a reply": the record steps back, the reply writes itself
      tl.to(["#a1-enq", "#a1-crm"], { y: -40, opacity: 0, scale: 0.94, duration: 0.35, ease: "power3.in", stagger: 0.04 }, W.ai - 0.35);
      tl.fromTo("#a1-draft", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, W.ai - 0.05);
      step("#a1-s3", W.ai);
      ["#a1-d1", "#a1-d2", "#a1-d3"].forEach((d, i) => {
        tl.fromTo(d, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.42, ease: "steps(18)" }, W.replies + i * 0.36);
      });
      // "right away": it goes out; "in your tone": your templates
      tl.fromTo("#a1-review", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.32, ease: "back.out(1.6)" }, W.right - 0.15);
      tl.set("#a1-ap1", { opacity: 0 }, W.away); tl.set("#a1-ap2", { opacity: 1 }, W.away);
      tl.fromTo("#a1-approve", { scale: 1 }, { scale: 1.08, duration: 0.1, yoyo: true, repeat: 1 }, W.away);
      tl.to("#a1-approve", { backgroundColor: "#0B1016", duration: 0.15 }, W.away);
      step("#a1-s4", W.away);
      tl.fromTo("#a1-edit", { borderColor: "#C6CBD5", color: "#4E5666" }, { borderColor: "#2257EF", color: "#2257EF", duration: 0.2 }, W.style - 0.1);
      tl.fromTo("#a1-edit", { scale: 1 }, { scale: 1.08, duration: 0.1, yoyo: true, repeat: 1 }, W.style - 0.1);
      tl.fromTo("#a1-prog", { scaleX: {{P0}} }, { scaleX: {{P1}}, duration: {{DUR}}, ease: "none" }, 0);
      window.__timelines["a1"] = tl;
    })();
  </script>
</template>
